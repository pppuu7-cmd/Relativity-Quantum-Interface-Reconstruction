name: RQIR post573 Iter424 full spectrum matrix
on:
  push:
    paths:
      - 'candidate_gravity/triggers/post573_iter424_full_spectrum_matrix.trigger'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        name: Build exact historical artifact matrix
        run: |
          root="candidate_gravity/artifacts/post573_iter424_full_spectrum_matrix"; mkdir -p "$root"
          python candidate_gravity/code/post523_independent_base_half_assembly.py --emit-artifact-manifest > "$root/basehalf_manifest.json"
          python candidate_gravity/code/post573_iter424_full_spectrum_gate.py --emit-quarter-manifest > "$root/quarter_manifest.json"
          m=$(python candidate_gravity/code/post573_build_crossrun_raw_matrix.py --basehalf-manifest "$root/basehalf_manifest.json" --quarter-manifest "$root/quarter_manifest.json")
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json,os
          m=json.loads(os.environ['MATRIX']) if False else None
          PY
  collect:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact historical raw authority
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ matrix.artifact_id }}
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Relativity-Quantum-Interface-Reconstruction
          run-id: ${{ matrix.run_id }}
          path: raw
      - name: Verify exact scientific SHA and normalize slot
        env:
          FAMILY: ${{ matrix.family }}
          RANK: ${{ matrix.rank }}
          PART: ${{ matrix.part }}
          WANT_SHA: ${{ matrix.sha256 }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
          SOURCE_RUN_ID: ${{ matrix.run_id }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,shutil
          hits=list(pathlib.Path('raw').rglob('result.json'))
          if len(hits)!=1: raise SystemExit(('result_count_drift',[str(x) for x in hits]))
          raw=hits[0].read_bytes(); got=hashlib.sha256(raw).hexdigest(); want=os.environ['WANT_SHA'].lower()
          if got!=want: raise SystemExit(('scientific_sha_mismatch',got,want))
          o=json.loads(raw)
          if not o.get('rows'): raise SystemExit(('raw_rows_missing',o.get('classification')))
          d=pathlib.Path('payload')/os.environ['FAMILY']/os.environ['RANK']/os.environ['PART']; d.mkdir(parents=True,exist_ok=True); (d/'result.json').write_bytes(raw)
          (d/'transport.json').write_text(json.dumps({'artifact_id':int(os.environ['ARTIFACT_ID']),'source_run_id':int(os.environ['SOURCE_RUN_ID']),'scientific_json_sha256':got,'family':os.environ['FAMILY'],'rank':os.environ['RANK'],'part':os.environ['PART']},indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rqir-post573-rawslot-${{ matrix.slot }}
          path: payload/
          retention-days: 7
  spectral:
    needs: [prepare,collect]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check -q numpy==2.1.3 mpmath==1.3.0 scipy==1.14.1
      - name: Rebuild manifests
        run: |
          root="candidate_gravity/artifacts/post573_iter424_full_spectrum_matrix"; mkdir -p "$root"
          python candidate_gravity/code/post523_independent_base_half_assembly.py --emit-artifact-manifest > "$root/basehalf_manifest.json"
          python candidate_gravity/code/post573_iter424_full_spectrum_gate.py --emit-quarter-manifest > "$root/quarter_manifest.json"
      - name: Download all current-run verified raw slots
        uses: actions/download-artifact@v5
        with:
          pattern: rqir-post573-rawslot-*
          merge-multiple: true
          path: candidate_gravity/artifacts/post573_iter424_full_spectrum_matrix/bundle
      - name: Verify multipart support and normalize exact bundle
        run: |
          root="candidate_gravity/artifacts/post573_iter424_full_spectrum_matrix"
          python candidate_gravity/code/post573_normalize_crossrun_raw_bundle.py --basehalf-manifest "$root/basehalf_manifest.json" --quarter-manifest "$root/quarter_manifest.json" --bundle "$root/bundle" --flat-basehalf-manifest "$root/basehalf_flat_manifest.json" | tee "$root/normalization.json"
      - name: Run frozen Iter407 spectral reconstruction and Iter424 numerical clauses
        run: |
          root="candidate_gravity/artifacts/post573_iter424_full_spectrum_matrix"
          set +e
          python candidate_gravity/code/post573_iter424_full_spectrum_gate.py --basehalf-manifest "$root/basehalf_flat_manifest.json" --bundle "$root/bundle" > "$root/result.json"
          rc=$?
          echo "$rc" > "$root/scientific_exit_code.txt"
          exit 0
      - name: Raw result integrity audit
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/post573_iter424_full_spectrum_matrix'); p=root/'result.json'
          if not p.exists() or p.stat().st_size==0: raise SystemExit(2)
          raw=p.read_bytes(); o=json.loads(raw); t=o.get('target',{}); fr=o.get('frozen',{}); cs=o.get('iteration424_clause_status',{})
          allowed={'PASS_ITER424_FULL_SPECTRUM_NUMERICAL_CLAUSES__TENSOR11_STILL_BLOCKED__NON_PROMOTING','FAIL_ITER424_FULL_SPECTRUM_NUMERICAL_CLAUSE__NON_PROMOTING'}
          valid=bool(o.get('stage')=='POST573_ITER424_FULL_SPECTRUM_FROM_RAW_ARTIFACTS__UNNUMBERED_COLLISION_SAFE' and o.get('classification') in allowed and o.get('promotes_physical_coordinate') is False and t.get('double_double_index')==2 and t.get('class_id')==3 and abs(float(t.get('q_squared'))+1)<1e-12 and fr.get('mass_steps')==[5e-06,2.5e-06,1.25e-06] and fr.get('precision_digits')==[80,120] and cs.get('direct_original_integrand_crosscheck','').startswith('PASS_INHERITED_ITERATION573') and cs.get('tensor_degree_1_1_fit_residual','').startswith('OPERATIONAL_BLOCKED'))
          a={'schema':'rqir_action_result_authority_audit_v1','stage':o.get('stage'),'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'classification':o.get('classification'),'scientific_gate_pass':o.get('scientific_gate_pass'),'raw_result_integrity_valid':valid,'authority_scope':'ITER424_FULL_SPECTRUM_NUMERICAL_CLAUSES_FROM_EXACT_RAW_VALID_ARTIFACTS__NON_PROMOTING'}
          (root/'authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not valid: raise SystemExit(2)
          PY
      - name: Commit raw runtime result for independent consumption
        run: |
          root="candidate_gravity/artifacts/post573_iter424_full_spectrum_matrix"
          out="candidate_gravity/results/runtime_post573_iter424_full_spectrum_run_${GITHUB_RUN_ID}.json"
          audit="candidate_gravity/results/runtime_post573_iter424_full_spectrum_run_${GITHUB_RUN_ID}_audit.json"
          cp "$root/result.json" "$out"; cp "$root/authority_audit.json" "$audit"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$out" "$audit"
          git commit -m "RQIR post573: persist raw spectral runtime ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload raw spectral artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqir-post573-iter424-full-spectrum-matrix-${{ github.run_id }}
          path: |
            candidate_gravity/artifacts/post573_iter424_full_spectrum_matrix/result.json
            candidate_gravity/artifacts/post573_iter424_full_spectrum_matrix/authority_audit.json
            candidate_gravity/artifacts/post573_iter424_full_spectrum_matrix/normalization.json
            candidate_gravity/artifacts/post573_iter424_full_spectrum_matrix/scientific_exit_code.txt
          retention-days: 90
