name: RQIR Iter668 conserved detector bridge
on:
  push:
    paths:
      - 'candidate_gravity/verification/iteration668_conserved_detector_gauge_invariant_bridge.py'
      - '.github/workflows/rqir-iteration668-conserved-detector-bridge.yml'
  workflow_dispatch:
jobs:
  iteration668-conserved-detector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate conserved-detector gauge-invariant bridge
        run: python candidate_gravity/verification/iteration668_conserved_detector_gauge_invariant_bridge.py
      - name: Fail-closed raw validation
        run: |
          python - <<'PY'
          import json
          d=json.load(open('candidate_gravity/results/iteration668_conserved_detector_gauge_invariant_bridge.json'))
          assert d['iteration']==668 and d['scientific_gate_pass'] is True and d['failures']==[]
          assert d['blocked'] is True and d['zero_fill'] is False
          assert d['frozen_contract']['detector_geometry']=='UNSPECIFIED_BLOCKED'
          print('PASS_RAW_AUDIT_ITER668',d['classification'])
          PY
      - name: Upload raw Iter668 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iteration668-conserved-detector-bridge
          path: candidate_gravity/results/iteration668_conserved_detector_gauge_invariant_bridge.json
          if-no-files-found: error
