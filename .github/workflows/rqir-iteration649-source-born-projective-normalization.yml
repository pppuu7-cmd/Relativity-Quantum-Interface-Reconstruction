name: RQIR Iter649 Source-Born projective normalization audit

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration649_source_born_projective_normalization_audit.py'
      - '.github/workflows/rqir-iteration649-source-born-projective-normalization.yml'
  workflow_dispatch:

jobs:
  iteration649:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Source-Born normalization class before subtraction
        run: python candidate_gravity/code/iteration649_source_born_projective_normalization_audit.py
      - name: Validate fail-closed Iter649 result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/iteration649_source_born_projective_normalization_audit/result.json').read_text())
          assert d['iteration']==649
          assert d['MODEL_READINESS']=='24%'
          assert d['candidate_residual'] is False
          assert d['candidate_values_used'] is False
          assert d['normalization_fit'] is False
          assert d['zero_fill'] is False
          assert d['source_born_subtraction']=='NOT_PERFORMED'
          assert d['native_Y_Tcut_projection']=='NOT_PERFORMED'
          assert d['comparator_quotient']=='NOT_PERFORMED'
          assert d['matched_source_born_object_established'] is False
          assert d['same_common_factor_established'] is False
          assert d['open_response_usable_as_closed_born_proxy'] is False
          assert d['authority_inputs']['iter629_single_common_N_native_exists'] is False
          assert d['authority_inputs']['iter629_open_over_closed_family_ratios']==[-1.0,-2.0,-3.0]
          assert d['scientific_gate_pass'] is True
          assert d['classification']=='BLOCKED_ITER649_MATCHED_SOURCE_BORN_ONE_COMMON_FACTOR_CLASS_NOT_ESTABLISHED__OPEN_RESPONSE_PROXY_REJECTED_BY_ITER629__NON_RESIDUAL'
          assert d['failures']==[]
          print(d['classification'])
          PY
      - name: Upload raw Iter649 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iteration649-source-born-projective-normalization
          path: results/iteration649_source_born_projective_normalization_audit/result.json
          if-no-files-found: error
