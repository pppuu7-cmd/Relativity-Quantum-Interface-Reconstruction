name: RQIR Iter584 MSSC mixed bilinear K2

on:
  push:
    branches: [ main ]
    paths:
      - 'analysis/source_k2_bilinear_iteration584.py'
      - '.github/workflows/rqir-iteration584-source-k2-bilinear.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k2-bilinear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Run frozen mixed bilinear K2 audit
        run: python analysis/source_k2_bilinear_iteration584.py
      - name: Fail-closed authority audit
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('results/iteration584_source_k2_bilinear/result.json'); a=Path('results/iteration584_source_k2_bilinear/authority_audit.json')
          r=json.loads(p.read_text()); u=json.loads(a.read_text()); sha=hashlib.sha256(p.read_bytes()).hexdigest(); f=[]
          if r.get('iteration')!=584: f.append('iteration mismatch')
          if r.get('parent_authority')!='Iter583 / MSSC-001': f.append('parent mismatch')
          if r.get('failures')!=[] or not r.get('raw_result_integrity_valid'): f.append('scientific failures')
          if r.get('source_born_subtraction')!='NOT_PERFORMED': f.append('premature subtraction')
          if r.get('ANSATZ_003')!='FORBIDDEN' or r.get('Fisher_resources')!='FORBIDDEN': f.append('guardrail violation')
          if u.get('result_sha256')!=sha or u.get('classification')!='PASS_RAW_AUTHORITY_AUDIT_ITER584_K2_BILINEAR': f.append('raw audit mismatch')
          if f: raise SystemExit('\n'.join(f))
          print('PASS fail-closed Iter584 raw audit',sha)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rqir-iter584-mssc-k2-bilinear
          path: results/iteration584_source_k2_bilinear/
          if-no-files-found: error
          retention-days: 30
