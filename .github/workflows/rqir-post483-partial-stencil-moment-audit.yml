name: RQIR post483 partial-stencil moment audit

on:
  push:
    paths:
      - '.github/workflows/rqir-post483-partial-stencil-moment-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact_moment_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact rational moment audit
        run: python candidate_gravity/audits/post483_partial_stencil_moment_defect_audit.py > /tmp/result.json
      - name: Validate and commit result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/result.json'); o=json.loads(p.read_text())
          assert o['classification']=='PASS_PARTIAL_WEIGHT_COVERAGE_NOT_DERIVATIVE_COMPLETION__NON_PROMOTING'
          assert o['scientific_gate_pass'] is True
          assert o['full_moments_k0_to_k5']==['0','1','0','0','0','-4']
          assert o['known_rows_i0_to_i2_moments_k0_to_k5'][:5]==['1/12','7/6','1/3','2/3','4/3']
          assert o['exact_restoration'] is True
          out=pathlib.Path('candidate_gravity/results/post483_partial_stencil_moment_defect_audit.json')
          out.write_text(json.dumps(o,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add candidate_gravity/results/post483_partial_stencil_moment_defect_audit.json
          git commit -m 'RQIR post483: record exact partial-stencil moment defect'
          git pull --rebase origin main
          git push origin HEAD:main
