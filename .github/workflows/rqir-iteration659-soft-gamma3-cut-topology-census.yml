name: RQIR Iter659 Soft Gamma3 Cut Topology Census

on:
  push:
    branches: [main]
    paths:
      - 'candidate_gravity/verification/iteration659_soft_gamma3_cut_topology_census.py'
      - '.github/workflows/rqir-iteration659-soft-gamma3-cut-topology-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration659-soft-gamma3-cut-topology-census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Evaluate same-parent soft Gamma3 topology census
        run: python candidate_gravity/verification/iteration659_soft_gamma3_cut_topology_census.py

      - name: Fail-closed raw result validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('candidate_gravity/results/iteration659_soft_gamma3_cut_topology_census.json').read_text(encoding='utf-8'))
          assert d['iteration'] == 659
          assert d['failures'] == []
          assert d['scientific_gate_pass'] is True
          assert d['MODEL_READINESS'] == '24%'
          assert d['zero_fill_allowed'] is False
          assert d['candidate_cut_values_read'] is False
          assert d['source_born_subtraction'] == 'NOT_PERFORMED'
          assert d['native_soft_T_cut_value_computed'] is False
          assert d['normalized_parent_prefactor'] == 'i/2 common; no family-wise refit'
          c=d['checks']
          assert c['term_count'] == 6
          assert c['family_counts'] == {'K3':1,'K1K2':3,'K1^3':2}
          assert c['coefficients'] == [1,-1,-1,-1,1,1]
          assert c['propagator_counts'] == [1,2,2,2,3,3]
          assert c['all_terms_retained'] is True
          assert c['k3_not_mislabelled_as_external_two_line_cut'] is True
          assert c['bubble_support_not_zero_filled'] is True
          assert c['triangle_support_left_for_soft_routing_audit'] is True
          print('PASS_RAW_AUTHORITY_AUDIT_ITER659_SOFT_GAMMA3_CUT_TOPOLOGY_CENSUS')
          PY

      - name: Upload raw authority artifact
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iteration659-soft-gamma3-cut-topology-census
          path: candidate_gravity/results/iteration659_soft_gamma3_cut_topology_census.json
          if-no-files-found: error
          retention-days: 90
