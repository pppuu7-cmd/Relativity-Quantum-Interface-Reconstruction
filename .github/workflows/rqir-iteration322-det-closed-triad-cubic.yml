name: rqir-iteration322-det-closed-triad-cubic

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration322_det_closed_triad_cubic_coefficient.py'
      - '.github/workflows/rqir-iteration322-det-closed-triad-cubic.yml'

jobs:
  iteration322:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy
      - name: Compute momentum-closed determinant cubic coefficient
        run: python candidate_gravity/code/iteration322_det_closed_triad_cubic_coefficient.py > iteration322_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration322_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==322 and 'scientific_gate_pass' in o
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':322,'found_iterations':[o.get('iteration')],'top_level_object_count':1,'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==322,'scientific_authority_pass':bool(ok and o.get('scientific_gate_pass')),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration322_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration322-result
          path: |
            iteration322_result.json
            iteration322_authority_audit.json
      - name: Enforce scientific gate
        run: python -c "import json; o=json.load(open('iteration322_result.json')); assert o['scientific_gate_pass'], (o['classification'],o.get('trace_closure'),o.get('shared_background_parent_result',{}).get('ghost_common_fixture_validation_max_abs_error_by_degree'))"
