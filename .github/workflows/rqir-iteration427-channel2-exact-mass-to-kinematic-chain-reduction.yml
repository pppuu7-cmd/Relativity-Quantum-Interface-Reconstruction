name: rqir-iteration427-channel2-exact-mass-to-kinematic-chain-reduction

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration427_channel2_exact_mass_to_kinematic_chain_reduction.py'
      - '.github/workflows/rqir-iteration427-channel2-exact-mass-to-kinematic-chain-reduction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration427:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic dependency
        run: python -m pip install --disable-pip-version-check -q sympy
      - name: Run exact chain reduction
        run: |
          root="candidate_gravity/artifacts/iteration427"
          mkdir -p "$root"
          python candidate_gravity/code/iteration427_channel2_exact_mass_to_kinematic_chain_reduction.py > "$root/iteration427_result.json"
      - name: Raw parse and authority audit
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/iteration427')
          p=root/'iteration427_result.json'
          if not p.exists() or p.stat().st_size==0: raise SystemExit(2)
          raw=p.read_bytes(); o=json.loads(raw); t=o.get('target',{}); ck=o.get('identity_checks',{})
          ok=bool(
              o.get('iteration')==427 and o.get('scientific_gate_pass') is True and
              o.get('authority_scope')=='EXACT_ANALYTIC_CONTRACT__NO_PHYSICAL_COORDINATE_PROMOTION' and
              o.get('classification')=='PASS_CHANNEL2_EXACT_MASS_TO_KINEMATIC_CHAIN_REDUCTION__NON_PROMOTING' and
              t.get('double_double_global_index')==2 and t.get('class_id')==3 and abs(float(t.get('q_squared'))+1.0)<1e-12 and
              ck.get('general_chain_identity') is True and ck.get('coefficient_identity') is True and ck.get('target_s1_identity') is True and
              o.get('exact_cancellations')==['H_alpha','H_rho','H_alpharho']
          )
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':427,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'classification':o.get('classification'),'scientific_authority_pass':ok,'authority_scope':'EXACT_ANALYTIC_CONTRACT__NO_PHYSICAL_COORDINATE_PROMOTION'}
          (root/'iteration427_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload analytic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration427-channel2-exact-chain-reduction
          path: candidate_gravity/artifacts/iteration427/
          if-no-files-found: warn
          retention-days: 90
