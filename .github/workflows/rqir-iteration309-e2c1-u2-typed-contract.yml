name: rqir-iteration309-e2c1-u2-typed-contract

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration309_e2c1_u2_typed_operator_contract.py'
      - '.github/workflows/rqir-iteration309-e2c1-u2-typed-contract.yml'

jobs:
  iteration309:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run scientific contract and preserve diagnostics
        id: science
        shell: bash
        run: |
          set +e
          python candidate_gravity/code/iteration309_e2c1_u2_typed_operator_contract.py > iteration309_result.json
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Authority schema/sentinel audit
        shell: bash
        run: |
          python - <<'PY'
          import json,hashlib
          p='iteration309_result.json'
          raw=open(p,'rb').read()
          obj=json.loads(raw)
          ok=(isinstance(obj,dict) and obj.get('iteration')==309 and 'scientific_gate_pass' in obj)
          audit={
            'schema':'rqir_action_result_authority_audit_v1',
            'path':p,
            'expected_iteration':309,
            'found_iterations':[obj.get('iteration')] if isinstance(obj,dict) else [],
            'top_level_object_count':1 if isinstance(obj,dict) else 0,
            'valid_single_top_level':isinstance(obj,dict),
            'valid_expected_iteration':obj.get('iteration')==309 if isinstance(obj,dict) else False,
            'scientific_authority_pass':bool(ok and obj.get('scientific_gate_pass')),
            'sha256':hashlib.sha256(raw).hexdigest(),
            'bytes':len(raw)
          }
          open('iteration309_authority_audit.json','w').write(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          assert ok, audit
          PY
      - name: Upload raw scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration309-result
          path: |
            iteration309_result.json
            iteration309_authority_audit.json
      - name: Enforce scientific gate after evidence upload
        shell: bash
        run: |
          python - <<'PY'
          import json
          obj=json.load(open('iteration309_result.json'))
          assert obj['scientific_gate_pass'], obj['classification']
          PY
