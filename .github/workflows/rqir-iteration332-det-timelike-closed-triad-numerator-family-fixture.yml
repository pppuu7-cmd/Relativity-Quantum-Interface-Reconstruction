name: rqir-iteration332-det-timelike-closed-triad-numerator-family-fixture

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration332_det_timelike_closed_triad_numerator_family_fixture.py'
      - '.github/workflows/rqir-iteration332-det-timelike-closed-triad-numerator-family-fixture.yml'

# Rerun after serialization-only repair; scientific fixture and thresholds unchanged.
jobs:
  iteration332:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run timelike closed-triad numerator-family gate and preserve diagnostics
        run: |
          set +e
          python candidate_gravity/code/iteration332_det_timelike_closed_triad_numerator_family_fixture.py > iteration332_result.json
          code=$?
          echo "$code" > iteration332_scientific_exit_code.txt
          exit 0
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration332_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==332 and 'scientific_gate_pass' in o and 'timelike_fixture' in o
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':332,'found_iterations':[o.get('iteration')],
             'top_level_object_count':1,'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==332,
             'scientific_authority_pass':bool(ok and o.get('scientific_gate_pass')),
             'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),
             'scientific_exit_code':int(open('iteration332_scientific_exit_code.txt').read())}
          open('iteration332_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration332-result
          path: |
            iteration332_result.json
            iteration332_authority_audit.json
            iteration332_scientific_exit_code.txt
      - name: Enforce scientific gate
        run: python -c "import json; o=json.load(open('iteration332_result.json')); assert o['scientific_gate_pass'], o"
