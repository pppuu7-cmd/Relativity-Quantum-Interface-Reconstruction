name: RQIR Iter596 nonlinear Ward contract freeze audit

on:
  push:
    branches: [ main ]
    paths:
      - 'candidate_gravity/contracts/ITERATION596_NONLINEAR_WARD_CONTRACT.md'
      - 'analysis/nonlinear_ward_contract_iteration596.py'
      - '.github/workflows/rqir-iteration596-nonlinear-ward-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ward-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Audit frozen nonlinear Ward contract and one-leg reduction
        run: python analysis/nonlinear_ward_contract_iteration596.py
      - name: Fail-closed raw result audit
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('results/iteration596_nonlinear_ward_contract')
          r=root/'result.json'; a=root/'authority_audit.json'
          result=json.loads(r.read_text()); audit=json.loads(a.read_text())
          sha=hashlib.sha256(r.read_bytes()).hexdigest(); failures=[]
          if result.get('iteration') != 596: failures.append('iteration mismatch')
          if result.get('classification') != 'PASS_PROSPECTIVE_FULL_NONLINEAR_WARD_CONTRACT_FREEZE_AND_ONE_LEG_REDUCTION__NON_RESIDUAL': failures.append('contract classification not PASS')
          if result.get('failures') != []: failures.append('scientific failures present')
          if result.get('source_born_subtraction') != 'NOT_PERFORMED': failures.append('premature Source/Born subtraction')
          if result.get('source_to_iter582_map') != 'NOT_PERFORMED': failures.append('premature source-to-Iter582 map')
          if result.get('ANSATZ_003') != 'FORBIDDEN': failures.append('ANSATZ-003 guardrail violation')
          if result.get('Fisher_resources') != 'FORBIDDEN': failures.append('Fisher/resources guardrail violation')
          required={'gauge-leg linear contraction','spectator-u Lie derivative','spectator-v Lie derivative','left scalar endpoint','right scalar endpoint'}
          if set(result.get('mandatory_full_terms',[])) != required: failures.append('nonlinear Ward term inventory drift')
          if audit.get('result_sha256') != sha: failures.append('result sha mismatch')
          if audit.get('contract_sha256') != result.get('contract_sha256'): failures.append('contract sha mismatch')
          if audit.get('classification') != 'PASS_RAW_AUTHORITY_AUDIT_ITER596_NONLINEAR_WARD_CONTRACT': failures.append('authority audit not PASS')
          if failures: raise SystemExit('\n'.join(failures))
          print('PASS fail-closed Iter596 raw audit',sha)
          PY
      - name: Upload raw artifact
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iter596-nonlinear-ward-contract
          path: results/iteration596_nonlinear_ward_contract/
          if-no-files-found: error
          retention-days: 30
