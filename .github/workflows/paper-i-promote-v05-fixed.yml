name: paper-i-promote-v05-fixed

on:
  push:
    branches: [paper-I-v03-evidence-boundary]
    paths:
      - '.github/workflows/paper-i-promote-v05-fixed.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper-I-v03-evidence-boundary
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded manuscript promotion
        run: python manuscripts/paper_I/promote_v05.py
      - name: Validate and commit
        run: |
          git diff --check
          git diff -- manuscripts/paper_I/main.tex
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscripts/paper_I/main.tex
          git commit -m 'paper I v0.5: promote clean Toy009/Toy010 certificate'
          git push origin HEAD:paper-I-v03-evidence-boundary
