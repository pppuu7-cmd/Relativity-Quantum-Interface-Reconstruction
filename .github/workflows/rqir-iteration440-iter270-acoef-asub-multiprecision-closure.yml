name: RQIR Iteration 440 Iter270 Acoef Asub multiprecision closure

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration440_iter270_acoef_asub_multiprecision_closure.py'
      - '.github/workflows/rqir-iteration440-iter270-acoef-asub-multiprecision-closure.yml'

permissions:
  contents: read

jobs:
  iteration440:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check -q numpy==2.1.3 mpmath==1.3.0
      - name: Run Iteration 440 Acoef Asub multiprecision closure
        run: |
          root="candidate_gravity/artifacts/iteration440"
          mkdir -p "$root"
          python candidate_gravity/code/iteration440_iter270_acoef_asub_multiprecision_closure.py > "$root/iteration440_result.json"
      - name: Raw authority audit
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/iteration440'); p=root/'iteration440_result.json'
          if not p.exists() or p.stat().st_size==0: raise SystemExit(2)
          raw=p.read_bytes(); o=json.loads(raw); obs=o.get('observed',{}); th=o.get('thresholds',{})
          ok=bool(o.get('iteration')==440 and o.get('scientific_gate_pass') is True and
              o.get('authority_scope')=='PARENT_PRECISION_CLOSURE__ITERATION270_ACOEF_ASUB_SIGNED_ASSEMBLY__NON_PROMOTING' and
              o.get('classification')=='PASS_ITER270_ACOEF_ASUB_80_120_DIGIT_ARITHMETIC_CLOSURE__NON_PROMOTING' and
              th.get('mp80_vs_mp120_Acoef_scaled_max')=='1e-30' and th.get('required_node_count')==26 and th.get('required_subset_count')==7 and
              obs.get('node_count')==26 and obs.get('subset_count')==7 and obs.get('all_values_finite') is True)
          audit={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':440,'authority_scope':o.get('authority_scope'),'classification':o.get('classification'),'scientific_authority_pass':ok,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (root/'iteration440_authority_audit.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload raw Iteration 440 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iteration440-iter270-acoef-asub-multiprecision-closure
          path: candidate_gravity/artifacts/iteration440/
          if-no-files-found: error
          retention-days: 90
