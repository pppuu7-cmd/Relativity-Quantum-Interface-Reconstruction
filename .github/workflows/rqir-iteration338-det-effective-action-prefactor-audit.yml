name: rqir-iteration338-det-effective-action-prefactor-audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration338_det_effective_action_prefactor_audit.py'
      - '.github/workflows/rqir-iteration338-det-effective-action-prefactor-audit.yml'

jobs:
  iteration338:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run determinant effective-action prefactor audit
        run: python candidate_gravity/code/iteration338_det_effective_action_prefactor_audit.py > iteration338_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration338_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==338 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':338,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==338,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration338_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration338-result
          path: |
            iteration338_result.json
            iteration338_authority_audit.json
