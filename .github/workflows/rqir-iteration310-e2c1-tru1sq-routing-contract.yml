name: rqir-iteration310-e2c1-tru1sq-routing-contract

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration310_e2c1_tru1sq_routing_contract.py'
      - '.github/workflows/rqir-iteration310-e2c1-tru1sq-routing-contract.yml'

jobs:
  iteration310:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run scientific routing contract
        run: python candidate_gravity/code/iteration310_e2c1_tru1sq_routing_contract.py > iteration310_result.json
      - name: Authority schema/sentinel audit
        run: |
          python - <<'PY'
          import json,hashlib
          p='iteration310_result.json'; raw=open(p,'rb').read(); obj=json.loads(raw)
          ok=isinstance(obj,dict) and obj.get('iteration')==310 and obj.get('scientific_gate_pass') is True
          audit={'schema':'rqir_action_result_authority_audit_v1','path':p,'expected_iteration':310,
                 'found_iterations':[obj.get('iteration')],'top_level_object_count':1,
                 'valid_single_top_level':True,'valid_expected_iteration':obj.get('iteration')==310,
                 'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration310_authority_audit.json','w').write(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          assert ok, audit
          PY
      - name: Upload raw scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration310-result
          path: |
            iteration310_result.json
            iteration310_authority_audit.json
