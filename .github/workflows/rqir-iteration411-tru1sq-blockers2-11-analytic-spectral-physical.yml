name: rqir-iteration411-tru1sq-blockers2-11-analytic-spectral-physical

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration411_tru1sq_blockers2_11_analytic_spectral_physical.py'
      - '.github/workflows/rqir-iteration411-tru1sq-blockers2-11-analytic-spectral-physical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration411:
    strategy:
      fail-fast: false
      matrix:
        target_index: [2, 11]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RQIR_TARGET_INDEX: ${{ matrix.target_index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run frozen physical analytic spectral reduction
        run: |
          root="candidate_gravity/artifacts/iteration411/index_${RQIR_TARGET_INDEX}"
          mkdir -p "$root"
          python candidate_gravity/code/iteration411_tru1sq_blockers2_11_analytic_spectral_physical.py > "$root/iteration411_result.json"
      - name: Raw parse and authority audit
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          idx=int(os.environ['RQIR_TARGET_INDEX'])
          expected={2:(3,-1.0),11:(16,-0.34)}
          root=pathlib.Path(f'candidate_gravity/artifacts/iteration411/index_{idx}')
          p=root/'iteration411_result.json'
          if not p.exists() or p.stat().st_size==0:
              raise SystemExit(2)
          raw=p.read_bytes(); o=json.loads(raw); ch=o.get('channel',{})
          cl, q2 = expected[idx]
          ok=bool(
              o.get('iteration')==411 and
              o.get('scientific_gate_pass') is True and
              ch.get('double_double_global_index')==idx and
              ch.get('class_id')==cl and
              abs(float(ch.get('q_squared'))-q2)<1e-12 and
              ch.get('status') in ('CONVERGED','BLOCKED_CONVERGENCE') and
              o.get('thresholds',{}).get('physical_convergence_scaled_max')==2e-05 and
              o.get('thresholds',{}).get('direct_original_integrand_crosscheck_scaled_max')==2e-06
          )
          a={
              'schema':'rqir_action_result_authority_audit_v1',
              'expected_iteration':411,
              'target_index':idx,
              'bytes':len(raw),
              'sha256':hashlib.sha256(raw).hexdigest(),
              'classification':o.get('classification'),
              'scientific_authority_pass':ok,
          }
          (root/'iteration411_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload per-target physical artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration411-physical-index-${{ matrix.target_index }}
          path: candidate_gravity/artifacts/iteration411/index_${{ matrix.target_index }}/
          if-no-files-found: warn
          retention-days: 90
