name: rqir-iteration325-det-hn-arbitrary-incoming-momentum-routing

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration325_det_hn_arbitrary_incoming_momentum_routing.py'
      - '.github/workflows/rqir-iteration325-det-hn-arbitrary-incoming-momentum-routing.yml'

jobs:
  iteration325:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run arbitrary-incoming H/N routing certificate
        run: python candidate_gravity/code/iteration325_det_hn_arbitrary_incoming_momentum_routing.py > iteration325_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration325_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==325 and 'scientific_gate_pass' in o
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':325,'found_iterations':[o.get('iteration')],'top_level_object_count':1,'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==325,'scientific_authority_pass':bool(ok and o.get('scientific_gate_pass')),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration325_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration325-result
          path: |
            iteration325_result.json
            iteration325_authority_audit.json
      - name: Enforce scientific gate
        run: python -c "import json; o=json.load(open('iteration325_result.json')); assert o['scientific_gate_pass'], o"
