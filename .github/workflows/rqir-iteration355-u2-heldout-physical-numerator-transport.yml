name: rqir-iteration355-u2-heldout-physical-numerator-transport

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration355_u2_heldout_physical_numerator_transport.py'
      - '.github/workflows/rqir-iteration355-u2-heldout-physical-numerator-transport.yml'

jobs:
  iteration355:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run held-out physical numerator transport gate
        run: python candidate_gravity/code/iteration355_u2_heldout_physical_numerator_transport.py > iteration355_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration355_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==355 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':355,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==355,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration355_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration355-result
          path: |
            iteration355_result.json
            iteration355_authority_audit.json
