name: RQIR post483 BASE known12 spectral partial

on:
  push:
    paths:
      - '.github/workflows/rqir-post483-base-known12-spectral-partial.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  known12_partial:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check -q numpy==2.1.3 mpmath==1.3.0 scipy==1.14.1
      - name: Assemble spectral partial from all live-bound ranks 0..11
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate_gravity/artifacts/post483_base_known12_spectral_partial /tmp/rqir_known12
          python - <<'PY'
          from __future__ import annotations
          import contextlib,io,json,hashlib,pathlib,subprocess,os,zipfile
          import mpmath as mp
          ROOT=pathlib.Path('candidate_gravity/code'); RES=pathlib.Path('candidate_gravity/results')
          reg=json.loads((RES/'post483_live_certified_artifact_sweep_v3.json').read_text())
          assert reg['scientific_gate_pass'] is True and reg['complete_live_bound_ranks']==list(range(12)) and reg['mismatch_count']==0
          rows=reg['rows']
          byrank={r:[] for r in range(12)}
          for x in rows:
            if x['rank'] in byrank and x['live_binding_pass']: byrank[x['rank']].append(x)
          assert all(len(byrank[r])==1 for r in range(10)) and len(byrank[10])==2 and len(byrank[11])==1

          raw_by_rank={}
          for r in range(12):
            parts=[]
            for x in byrank[r]:
              aid=x['artifact_id']; zp=pathlib.Path('/tmp/rqir_known12')/f'{aid}.zip'; ex=pathlib.Path('/tmp/rqir_known12')/f'{aid}'
              subprocess.check_call(['curl','-fsSL','-H',f"Authorization: Bearer {os.environ['GH_TOKEN']}",'-H','Accept: application/vnd.github+json',f'https://api.github.com/repos/pppuu7-cmd/Relativity-Quantum-Interface-Reconstruction/actions/artifacts/{aid}/zip','-o',str(zp)])
              assert 'sha256:'+hashlib.sha256(zp.read_bytes()).hexdigest()==x['metadata_digest']==x['rest_zip_sha256']
              ex.mkdir(exist_ok=True); zipfile.ZipFile(zp).extractall(ex)
              matches=list(ex.rglob('result.json')); assert len(matches)==1,(r,aid,[str(p) for p in matches])
              p=matches[0]; assert hashlib.sha256(p.read_bytes()).hexdigest()==x['scientific_json_sha256'],(r,aid,'scientific_sha')
              o=json.loads(p.read_text()); assert o.get('scientific_gate_pass') is True and o.get('promotes_physical_coordinate') is False
              assert isinstance(o.get('rows'),list); parts.extend(o['rows'])
            assert len(parts)==80,(r,len(parts)); raw_by_rank[r]=parts

          # Exact class-3/index-2 spectral geometry via frozen Iteration-431 specialization.
          p407=ROOT/'iteration407_tru1sq_channel4_analytic_spectral_reduction.py'; s=p407.read_text()
          repl=[('ITERATION=407','ITERATION=431'),('TARGET_INDEX=4','TARGET_INDEX=2'),
                ("if int(ch['class_id'])!=5 or abs(q2+1.0)>1e-12: raise RuntimeError(('target_identity_drift',ch['class_id'],q2))",
                 "if int(ch['class_id'])!=3 or abs(q2+1.0)>1e-12: raise RuntimeError(('target_identity_drift',ch['class_id'],q2))")]
          for old,new in repl: assert s.count(old)==1,(old,s.count(old)); s=s.replace(old,new,1)
          marker='\nstart=time.perf_counter()\nd_base,diag_base=derivative_from_analytic(BASE_H)'; assert s.count(marker)==1
          ns={'__name__':'post483_known12_class3_geometry','__file__':str(p407)}
          with contextlib.redirect_stdout(io.StringIO()): exec(compile(s.split(marker,1)[0]+'\n',str(p407),'exec'),ns,ns)
          assert int(ns['ch']['class_id'])==3 and abs(float(ns['q2'])+1)<1e-12
          affine=ns['affine_coeffs']; kin=ns['kin']; TRAIN=[float(x) for x in ns['TRAIN_Z']]; DEG=int(ns['POLY_DEGREE']); H=float(ns['BASE_H'])
          assert TRAIN==[-0.86,-0.43,0.0,0.43,0.86] and DEG==4 and abs(H-5e-6)<1e-18
          manifest=json.loads((RES/'iteration455_mass_support_queue_manifest.json').read_text())['manifest']
          uv={int(x['distinct_rank']):(float(x['u']),float(x['v'])) for x in manifest if int(x['distinct_rank'])<16}

          def key(x): return (round(float(x['z']),12),int(x['phi_index']))
          maps={r:{key(x):x for x in raw_by_rank[r]} for r in range(12)}
          assert all(len(maps[r])==80 for r in maps)
          def mpcrow(x,dps): return mp.mpc(mp.mpf(x[f'mp{dps}_re']),mp.mpf(x[f'mp{dps}_im']))
          def F(rank,dps):
            u,v=uv[rank]
            with mp.workdps(dps):
              zz=[mp.mpf(repr(z)) for z in TRAIN]; yy=[]
              for z in TRAIN: yy.append(sum((mpcrow(maps[rank][(round(z,12),m)],dps) for m in range(16)),mp.mpc(0))/16)
              V=mp.matrix([[z**k for k in range(DEG+1)] for z in zz]); coeff=mp.lu_solve(V,mp.matrix(yy))
              cc0,aa0=affine(u,v); beta0=kin(u,v)[2]
              cc=mp.mpc(repr(float(cc0.real)),repr(float(cc0.imag))); aa=mp.mpc(repr(float(aa0.real)),repr(float(aa0.imag))); beta=mp.mpf(repr(float(beta0)))
              if abs(aa)<mp.mpf('1e-50'): js=[(mp.mpf(0) if k%2 else mp.mpf(2)/(k+1))/cc for k in range(DEG+1)]
              else:
                js=[(mp.log(cc+aa)-mp.log(cc-aa))/aa]
                for k in range(1,DEG+1):
                  im1=mp.mpf(0) if (k-1)%2 else mp.mpf(2)/k; js.append((im1-cc*js[-1])/aa)
              return mp.mpf('0.5')*beta*sum(coeff[k]*js[k] for k in range(DEG+1))
          vals={r:{d:F(r,d) for d in (80,120)} for r in range(12)}
          c=[mp.mpf(1)/12,-mp.mpf(2)/3,mp.mpf(2)/3,-mp.mpf(1)/12]
          with mp.workdps(180):
            hh=mp.mpf('5e-6')**2
            def term(r,d):
              i,j=divmod(r,4); return c[i]*c[j]*vals[r][d]/hh
            p80=sum((term(r,80) for r in range(12)),mp.mpc(0)); p120=sum((term(r,120) for r in range(12)),mp.mpc(0))
            disc=abs(p80-p120)/max(mp.mpf(1),abs(p80),abs(p120)); cond=sum(abs(term(r,120)) for r in range(12))/abs(p120) if p120!=0 else mp.inf
            # Dominant Q11 quartet is ranks 5,6,9,10.
            q11_120=sum((term(r,120) for r in (5,6,9,10)),mp.mpc(0)); q11_frac=abs(q11_120)/abs(p120) if p120!=0 else mp.inf
            node_disc={str(r):mp.nstr(abs(vals[r][80]-vals[r][120])/max(mp.mpf(1),abs(vals[r][80]),abs(vals[r][120])),40) for r in range(12)}
            passed=bool(mp.isfinite(p120.real) and mp.isfinite(p120.imag) and disc<=mp.mpf('2e-6'))
            out={'stage':'POST483_BASE_KNOWN12_CLASS3_SPECTRAL_PARTIAL_MP__NON_PROMOTING',
                 'classification':('PASS_BASE_KNOWN12_SPECTRAL_PARTIAL_MP80_MP120__NON_PROMOTING' if passed else 'BLOCKED_BASE_KNOWN12_SPECTRAL_PARTIAL_MP_STABILITY__NON_PROMOTING'),
                 'scientific_gate_pass':passed,'promotes_physical_coordinate':False,'MODEL_READINESS':'24%','readiness_change_pp':0,
                 'target':{'double_double_index':2,'class_id':3,'q_squared':-1.0},
                 'scope':'KNOWN_BASE_RANKS_0_11_ONLY__MISSING_RANKS_12_15_EXPLICIT__NOT_FULL_DERIVATIVE',
                 'frozen':{'known_ranks':list(range(12)),'missing_ranks':[12,13,14,15],'base_h':5e-6,'training_z':TRAIN,'phi_nodes':16,'degree':4,'precision_digits':[80,120]},
                 'observed':{'partial_mp80_re':mp.nstr(mp.re(p80),80),'partial_mp80_im':mp.nstr(mp.im(p80),80),'partial_mp120_re':mp.nstr(mp.re(p120),120),'partial_mp120_im':mp.nstr(mp.im(p120),120),'scaled_mp80_vs_mp120':mp.nstr(disc,40),'partial_cancellation_condition_proxy':mp.nstr(cond,40),'q11_mp120_re':mp.nstr(mp.re(q11_120),60),'q11_fraction_of_abs_partial':mp.nstr(q11_frac,40),'max_per_node_spectral_mp_discrepancy':max(node_disc.values(),key=lambda x: mp.mpf(x)),'per_node_scaled_mp_discrepancy':node_disc},
                 'diagnostic_threshold':{'scaled_partial_mp80_vs_mp120_max':'2e-6'},
                 'interpretation':['This directly propagates every currently raw-certified BASE node through the exact class-3 spectral contraction and central4 weights.','The last BASE u-row ranks 12..15 is omitted, not zero-filled; therefore the partial sum is not a derivative authority and cannot be compared as physical D_s.','A PASS isolates cross-precision stability of the known 12-node contribution while rank12 and later BASE nodes remain required.'],
                 'guardrails':['NO_ZERO_FILL_MISSING_ROW','NO_FULL_BASE_DERIVATIVE_CLAIM','NO_HALF_ASSEMBLY','NO_PHYSICAL_DS_PROMOTION','NO_THRESHOLD_WEAKENING','NO_SUPPORT_REORDERING','NO_ANSATZ003','NO_FISHER_RESOURCES']}
          pathlib.Path('candidate_gravity/artifacts/post483_base_known12_spectral_partial/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          if not passed: raise SystemExit(2)
          PY
      - name: Upload partial diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqir-post483-base-known12-spectral-partial
          path: candidate_gravity/artifacts/post483_base_known12_spectral_partial/
          retention-days: 90
      - name: Commit PASS partial diagnostic
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cp candidate_gravity/artifacts/post483_base_known12_spectral_partial/result.json candidate_gravity/results/post483_base_known12_spectral_partial.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add candidate_gravity/results/post483_base_known12_spectral_partial.json
          git commit -m 'RQIR post483: record known12 BASE spectral partial PASS'
          git pull --rebase origin main
          git push origin HEAD:main
