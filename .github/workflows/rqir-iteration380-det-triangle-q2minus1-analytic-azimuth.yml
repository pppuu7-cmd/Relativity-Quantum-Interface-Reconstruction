name: rqir-iteration380-det-triangle-q2minus1-analytic-azimuth

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration380_det_triangle_q2minus1_analytic_azimuth_reduction.py'
      - '.github/workflows/rqir-iteration380-det-triangle-q2minus1-analytic-azimuth.yml'

jobs:
  iteration380:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run q2=-1 determinant analytic azimuth reduction
        run: python candidate_gravity/code/iteration380_det_triangle_q2minus1_analytic_azimuth_reduction.py > iteration380_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration380_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==380 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':380,'found_iteration':o.get('iteration'),
             'valid_single_top_level':True,'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration380_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration380-result
          path: |
            iteration380_result.json
            iteration380_authority_audit.json
