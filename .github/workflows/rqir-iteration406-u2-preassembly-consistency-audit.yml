name: rqir-iteration406-u2-preassembly-consistency-audit

on:
  push:
    paths:
      - '.github/workflows/rqir-iteration406-u2-preassembly-consistency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration406:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run internal consistency audit
        run: |
          d=candidate_gravity/artifacts/iteration406
          mkdir -p "$d"
          python candidate_gravity/code/iteration406_u2_preassembly_internal_consistency_audit.py > "$d/iteration406_result.json"
      - name: Raw authority audit
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/iteration406'); p=root/'iteration406_result.json'; raw=p.read_bytes(); o=json.loads(raw)
          ok=bool(o.get('iteration')==406 and o.get('scientific_gate_pass') is True and o.get('record_count')==44)
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':406,'found_iteration':o.get('iteration'),'classification':o.get('classification'),'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'scientific_authority_pass':ok}
          (root/'iteration406_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload authority artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration406-u2-preassembly-consistency-audit
          path: candidate_gravity/artifacts/iteration406/
          if-no-files-found: error
          retention-days: 90
