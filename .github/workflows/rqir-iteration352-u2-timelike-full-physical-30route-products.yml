name: rqir-iteration352-u2-timelike-full-physical-30route-products

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration352_u2_timelike_full_physical_30route_products.py'
      - '.github/workflows/rqir-iteration352-u2-timelike-full-physical-30route-products.yml'

jobs:
  iteration352:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run full physical timelike 30-route matrix gate
        run: python candidate_gravity/code/iteration352_u2_timelike_full_physical_30route_products.py > iteration352_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration352_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==352 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':352,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==352,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration352_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration352-result
          path: |
            iteration352_result.json
            iteration352_authority_audit.json
