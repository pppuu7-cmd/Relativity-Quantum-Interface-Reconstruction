name: rqir-iteration418-tru1sq-channel2-mass-derivative-cancellation-audit

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration418_tru1sq_channel2_mass_derivative_cancellation_audit.py'
      - '.github/workflows/rqir-iteration418-tru1sq-channel2-mass-derivative-cancellation-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration418:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run channel2 mass-derivative cancellation audit
        run: |
          root="candidate_gravity/artifacts/iteration418"
          mkdir -p "$root"
          python candidate_gravity/code/iteration418_tru1sq_channel2_mass_derivative_cancellation_audit.py > "$root/iteration418_result.json"
      - name: Raw parse and authority audit
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/iteration418')
          p=root/'iteration418_result.json'
          if not p.exists() or p.stat().st_size==0:
              raise SystemExit(2)
          raw=p.read_bytes(); o=json.loads(raw); ch=o.get('channel',{})
          ok=bool(
              o.get('iteration')==418 and
              o.get('scientific_gate_pass') is True and
              o.get('authority_scope')=='DIAGNOSTIC_ONLY__NO_PHYSICAL_COORDINATE_PROMOTION' and
              ch.get('double_double_global_index')==2 and
              ch.get('class_id')==3 and
              abs(float(ch.get('q_squared'))+1.0)<1e-12 and
              ch.get('physical_status')=='BLOCKED_CONVERGENCE' and
              o.get('physical_threshold_unchanged')==2e-05 and
              o.get('frozen_h_values_reaudited')==[5e-06,2.5e-06,1.25e-06]
          )
          a={
              'schema':'rqir_action_result_authority_audit_v1',
              'expected_iteration':418,
              'target_index':2,
              'bytes':len(raw),
              'sha256':hashlib.sha256(raw).hexdigest(),
              'classification':o.get('classification'),
              'authority_scope':o.get('authority_scope'),
              'scientific_authority_pass':ok,
          }
          (root/'iteration418_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration418-channel2-mass-derivative-cancellation-audit
          path: candidate_gravity/artifacts/iteration418/
          if-no-files-found: warn
          retention-days: 90
