name: RQIR post479 artifact digest semantics diagnostic

on:
  push:
    paths:
      - '.github/workflows/rqir-post479-artifact-digest-semantics-diagnostic.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  digest_semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose one frozen certified artifact without scientific recomputation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9961449686'
          EXPECTED_DIGEST: '800fa05a9891c7cb3890d07c92bc3ab37df8ce22d94d5a2219ca5f58668e9792'
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/pppuu7-cmd/Relativity-Quantum-Interface-Reconstruction/actions/artifacts/${ARTIFACT_ID}" \
            -o diagnostic/metadata.json
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/pppuu7-cmd/Relativity-Quantum-Interface-Reconstruction/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o diagnostic/artifact.zip
          python - <<'PY' | tee diagnostic/digest_diagnostic.json
          import hashlib,json,os,pathlib,zipfile
          m=json.loads(pathlib.Path('diagnostic/metadata.json').read_text())
          z=pathlib.Path('diagnostic/artifact.zip').read_bytes()
          actual=hashlib.sha256(z).hexdigest()
          expected=os.environ['EXPECTED_DIGEST']
          names=[]
          try:
              with zipfile.ZipFile('diagnostic/artifact.zip') as f: names=f.namelist()
          except Exception as e:
              names=['ZIP_PARSE_ERROR:'+repr(e)]
          out={
            'stage':'POST479_ARTIFACT_DIGEST_SEMANTICS_DIAGNOSTIC__COLLISION_SAFE',
            'artifact_id':int(os.environ['ARTIFACT_ID']),
            'metadata_digest':m.get('digest'),
            'registry_expected_digest':'sha256:'+expected,
            'rest_download_sha256':'sha256:'+actual,
            'rest_download_matches_registry':actual==expected,
            'expired':m.get('expired'),
            'size_in_bytes_metadata':m.get('size_in_bytes'),
            'downloaded_zip_bytes':len(z),
            'zip_entries':names,
            'scientific_recomputation':False,
            'promotes_physical_coordinate':False,
            'MODEL_READINESS':'24%'
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rqir-post479-artifact-digest-semantics-diagnostic
          path: diagnostic/digest_diagnostic.json
          if-no-files-found: error
