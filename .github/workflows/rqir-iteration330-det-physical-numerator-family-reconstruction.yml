name: rqir-iteration330-det-physical-numerator-family-reconstruction

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration330_det_physical_numerator_family_reconstruction.py'
      - '.github/workflows/rqir-iteration330-det-physical-numerator-family-reconstruction.yml'

jobs:
  iteration330:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run physical determinant numerator-family reconstruction and preserve diagnostics
        run: |
          set +e
          python candidate_gravity/code/iteration330_det_physical_numerator_family_reconstruction.py > iteration330_result.json
          code=$?
          echo "$code" > iteration330_scientific_exit_code.txt
          exit 0
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration330_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==330 and 'scientific_gate_pass' in o and isinstance(o.get('families'),list)
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':330,'found_iterations':[o.get('iteration')],
             'top_level_object_count':1,'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==330,
             'scientific_authority_pass':bool(ok and o.get('scientific_gate_pass')),
             'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),
             'scientific_exit_code':int(open('iteration330_scientific_exit_code.txt').read())}
          open('iteration330_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration330-result
          path: |
            iteration330_result.json
            iteration330_authority_audit.json
            iteration330_scientific_exit_code.txt
      - name: Enforce scientific gate
        run: python -c "import json; o=json.load(open('iteration330_result.json')); assert o['scientific_gate_pass'], o"
