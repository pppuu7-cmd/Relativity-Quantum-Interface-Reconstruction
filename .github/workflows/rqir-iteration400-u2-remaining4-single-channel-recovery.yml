name: rqir-iteration400-u2-remaining4-single-channel-recovery

on:
  push:
    paths:
      - '.github/workflows/rqir-iteration400-u2-remaining4-single-channel-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration400:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        channel_index: [14, 15, 16, 17]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    name: iteration400 channel ${{ matrix.channel_index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run frozen remaining-channel arithmetic and preserve raw
        shell: bash
        env:
          CHANNEL_INDEX: '${{ matrix.channel_index }}'
        run: |
          d=candidate_gravity/artifacts/iteration400/channel-${CHANNEL_INDEX}
          mkdir -p "$d"
          set +e
          python candidate_gravity/code/iteration400_u2_remaining4_topology_masked_single_channel.py > "$d/iteration400_result.json"
          rc=$?
          echo "$rc" > "$d/python_exit_code.txt"
          exit 0
      - name: Raw parse and provenance audit
        shell: bash
        env:
          CHANNEL_INDEX: '${{ matrix.channel_index }}'
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          i=int(os.environ['CHANNEL_INDEX'])
          root=pathlib.Path(f'candidate_gravity/artifacts/iteration400/channel-{i}')
          p=root/'iteration400_result.json'; raw=p.read_bytes()
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':400,'expected_channel_index':i,
             'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'scientific_authority_pass':False}
          ok=False
          try:
            o=json.loads(raw); r=o.get('record',{})
            a.update({'found_iteration':o.get('iteration'),'found_channel_index':o.get('channel_index'),
                      'reported_scientific_gate_pass':o.get('scientific_gate_pass'),'status':r.get('status'),
                      'global_channel_index':r.get('global_channel_index'),'classification':o.get('classification')})
            ok=bool(o.get('iteration')==400 and o.get('channel_index')==i and r.get('global_channel_index')==i and
                    o.get('scientific_gate_pass') is True and r.get('status') in ('CONVERGED','BLOCKED_CONVERGENCE'))
          except Exception as exc:
            a['parse_error']=repr(exc)
          a['scientific_authority_pass']=ok
          (root/'iteration400_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload targeted recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration400-channel-${{ matrix.channel_index }}
          path: candidate_gravity/artifacts/iteration400/channel-${{ matrix.channel_index }}/
          if-no-files-found: error
          retention-days: 90
