name: RQIR Iter599 corrected full nonlinear Ward gate

on:
  push:
    branches: [ main ]
    paths:
      - 'analysis/nonlinear_ward_full_response_iteration599.py'
      - '.github/workflows/rqir-iteration599-corrected-full-nonlinear-ward.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrected-full-ward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run corrected frozen full nonlinear Ward evaluation
        run: python analysis/nonlinear_ward_full_response_iteration599.py
      - name: Fail-closed raw result audit
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('results/iteration599_full_nonlinear_ward_corrected')
          r=root/'result.json'; a=root/'authority_audit.json'
          if not r.exists() or not a.exists(): raise SystemExit('missing Iter599 raw outputs')
          result=json.loads(r.read_text()); audit=json.loads(a.read_text()); sha=hashlib.sha256(r.read_bytes()).hexdigest(); failures=[]
          if result.get('iteration') != 599: failures.append('iteration mismatch')
          if result.get('route_contract') != 'for each gauge singleton g: p=-q_g/2, pprime=+q_g/2; no arbitrary PROBES in anchor or Ward rows': failures.append('route contract mismatch')
          if result.get('source_born_subtraction') != 'NOT_PERFORMED': failures.append('premature Source/Born subtraction')
          if result.get('source_to_iter582_map') != 'NOT_PERFORMED': failures.append('premature source-to-Iter582 map')
          if result.get('candidate_residual') is not False: failures.append('premature candidate residual')
          if result.get('ANSATZ_003') != 'FORBIDDEN': failures.append('ANSATZ-003 guardrail violation')
          if result.get('Fisher_resources') != 'FORBIDDEN': failures.append('Fisher/resources guardrail violation')
          if audit.get('result_sha256') != sha: failures.append('result sha mismatch')
          valid_classes={
            'PASS_FULL_SOURCE_LEVEL_NONLINEAR_WARD_ON_EXACT_FROZEN_ITER596_SYMMETRIC_ROUTE__NON_RESIDUAL',
            'FAIL_FULL_SOURCE_LEVEL_NONLINEAR_WARD_ON_EXACT_FROZEN_ITER596_SYMMETRIC_ROUTE__PRESERVED_NEGATIVE_RESULT'}
          if result.get('classification') not in valid_classes: failures.append('unexpected scientific classification')
          anchors=result.get('implemented_one_leg_anchors',[]); rows=result.get('ward_rows',[])
          if len(anchors)!=12: failures.append(f'anchor count {len(anchors)} != 12')
          if len(rows)!=12: failures.append(f'ward row count {len(rows)} != 12')
          if any(x.get('route')!='p=-q_g/2,pprime=+q_g/2' for x in anchors+rows): failures.append('non-symmetric route row found')
          if failures: raise SystemExit('\n'.join(failures))
          print('PASS fail-closed Iter599 raw integrity audit',sha,'scientific_classification=',result.get('classification'))
          PY
      - name: Upload raw artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iter599-corrected-full-nonlinear-ward
          path: results/iteration599_full_nonlinear_ward_corrected/
          if-no-files-found: error
          retention-days: 30
      # Arm push after workflow creation; thresholds and scientific contract unchanged.
