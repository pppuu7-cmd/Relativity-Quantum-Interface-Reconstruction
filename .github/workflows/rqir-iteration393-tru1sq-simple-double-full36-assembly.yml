name: rqir-iteration393-tru1sq-simple-double-full36-assembly

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration393_tru1sq_simple_double_full36_manifest_assembly.py'
      - '.github/workflows/rqir-iteration393-tru1sq-simple-double-full36-assembly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration393:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble exact full-36 simple-double coordinate
        run: |
          mkdir -p candidate_gravity/artifacts/iteration393
          python candidate_gravity/code/iteration393_tru1sq_simple_double_full36_manifest_assembly.py > candidate_gravity/artifacts/iteration393/iteration393_result.json
      - name: Sentinel audit
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('candidate_gravity/artifacts/iteration393/iteration393_result.json'); raw=p.read_bytes(); o=json.loads(raw)
          c=o.get('census',{})
          ok=bool(o.get('iteration')==393 and o.get('scientific_gate_pass') is True and c.get('channel_count')==36 and c.get('unique_index_count')==36 and c.get('raw_chunk_count')==12 and c.get('all_channels_converged') is True)
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':393,'sha256':hashlib.sha256(raw).hexdigest(),
             'scientific_authority_pass':ok,'classification':o.get('classification')}
          pathlib.Path('candidate_gravity/artifacts/iteration393/iteration393_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration393-result
          path: candidate_gravity/artifacts/iteration393/
          if-no-files-found: error
          retention-days: 90
