name: rqir-iteration317-det-ghost-three-mode-routing

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration317_det_ghost_three_mode_routing.py'
      - '.github/workflows/rqir-iteration317-det-ghost-three-mode-routing.yml'

jobs:
  iteration317:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Run three-mode ghost routing certificate
        run: python candidate_gravity/code/iteration317_det_ghost_three_mode_routing.py > iteration317_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          p='iteration317_result.json'; raw=open(p,'rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==317 and 'scientific_gate_pass' in o
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':317,'found_iterations':[o.get('iteration')],
             'top_level_object_count':1,'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==317,
             'scientific_authority_pass':bool(ok and o.get('scientific_gate_pass')),
             'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration317_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok,a
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration317-result
          path: |
            iteration317_result.json
            iteration317_authority_audit.json
      - name: Enforce scientific gate
        run: python -c "import json; o=json.load(open('iteration317_result.json')); assert o['scientific_gate_pass'], (o['classification'],o.get('validation_max_abs_error_by_total_degree'),o.get('triple_mixed_111_max_abs_error'))"
