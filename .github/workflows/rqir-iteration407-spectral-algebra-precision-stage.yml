name: RQIR Iteration407 spectral-algebra precision stage

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration407_spectral_algebra_precision_stage.py'
      - '.github/workflows/rqir-iteration407-spectral-algebra-precision-stage.yml'

permissions:
  contents: read

jobs:
  spectral_algebra_precision:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check -q numpy==2.1.3 mpmath==1.3.0 scipy==1.14.1
      - name: Run Iteration407 spectral-algebra precision stage
        run: |
          root="candidate_gravity/artifacts/iteration407_spectral_algebra_precision_stage"
          mkdir -p "$root"
          python candidate_gravity/code/iteration407_spectral_algebra_precision_stage.py > "$root/result.json"
      - name: Raw authority audit
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/iteration407_spectral_algebra_precision_stage'); p=root/'result.json'
          if not p.exists() or p.stat().st_size==0: raise SystemExit(2)
          raw=p.read_bytes(); o=json.loads(raw); obs=o.get('observed',{}); fr=o.get('frozen',{})
          ok=bool(o.get('scientific_gate_pass') is True and o.get('promotes_physical_coordinate') is False and o.get('parent_sample_generation_precision_closed_by_this_gate') is False and fr.get('precision_digits')==[80,120] and fr.get('mass_nodes')==32 and obs.get('node_count')==32 and obs.get('all_finite') is True and o.get('thresholds',{}).get('scaled_mp80_vs_mp120_max')=='1e-30')
          audit={'schema':'rqir_action_result_authority_audit_v1','stage':o.get('stage'),'classification':o.get('classification'),'scientific_authority_pass':ok,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (root/'authority_audit.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload raw artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iteration407-spectral-algebra-precision-stage
          path: candidate_gravity/artifacts/iteration407_spectral_algebra_precision_stage/
          if-no-files-found: error
          retention-days: 90
