name: RQIR Iter607 fail-closed source-to-Iter582 projection

on:
  push:
    branches: [ main ]
    paths:
      - 'analysis/source_to_iter582_projection_evaluator_iteration607.py'
      - 'candidate_gravity/results/iteration606_source_to_iter582_mapping_contract_raw_consumption.json'
      - 'candidate_gravity/results/iteration605_full_source_nonlinear_ward_raw_consumption.json'
      - 'candidate_gravity/recovery/RECOVERY_DELTA_ITERATION_592.md'
      - '.github/workflows/rqir-iteration607-source-to-iter582-projection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection-evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run Iter607 fail-closed projection evaluator
        run: python analysis/source_to_iter582_projection_evaluator_iteration607.py
      - name: Fail-closed artifact integrity audit
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('results/iteration607_source_to_iter582_projection')
          r=root/'result.json'; a=root/'authority_audit.json'
          R=json.loads(r.read_text()); A=json.loads(a.read_text()); sha=hashlib.sha256(r.read_bytes()).hexdigest(); bad=[]
          if R.get('iteration') != 607: bad.append('iteration mismatch')
          if R.get('model_readiness_percent') != 24: bad.append('readiness drift')
          if R.get('candidate_residual') is not False: bad.append('improper residual promotion')
          if R.get('source_born_subtraction') != 'NOT_PERFORMED': bad.append('premature subtraction')
          if R.get('zero_fill') is not False: bad.append('zero-fill violation')
          if R.get('source_family_count') != 13: bad.append('source census drift')
          if R.get('q2_buckets') != [-1.0,-0.34,-0.14]: bad.append('q2 grouping drift')
          if A.get('result_sha256') != sha: bad.append('sha mismatch')
          if A.get('failures') != []: bad.append('raw audit failure')
          allowed=('BLOCKED_ITER607_EXPLICIT_DISTRIBUTIONAL_SOURCE_TO_NATIVE_LINKED_PROJECTOR_ABSENT',
                   'PASS_ITER607_EXPLICIT_DISTRIBUTIONAL_PROJECTOR_PRESENT__READY_FOR_NUMERICAL_PROJECTION')
          if R.get('classification') not in allowed: bad.append('unexpected classification')
          if bad: raise SystemExit('\n'.join(bad))
          print('PASS Iter607 raw artifact integrity',sha,R.get('classification'))
          PY
      - name: Upload raw artifact
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iter607-source-to-iter582-projection
          path: results/iteration607_source_to_iter582_projection/
          if-no-files-found: error
          retention-days: 30
