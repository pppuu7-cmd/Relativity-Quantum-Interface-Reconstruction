name: RQIR Iteration 439 Iter270 Acoef cancellation diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration439_iter270_acoef_cancellation_diagnostic.py'
      - '.github/workflows/rqir-iteration439-iter270-acoef-cancellation-diagnostic.yml'

permissions:
  contents: read

jobs:
  iteration439:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check -q numpy==2.1.3
      - name: Run Iteration 439 Acoef cancellation diagnostic
        run: |
          root="candidate_gravity/artifacts/iteration439"
          mkdir -p "$root"
          python candidate_gravity/code/iteration439_iter270_acoef_cancellation_diagnostic.py > "$root/iteration439_result.json"
      - name: Raw authority audit
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/iteration439'); p=root/'iteration439_result.json'
          if not p.exists() or p.stat().st_size==0: raise SystemExit(2)
          raw=p.read_bytes(); o=json.loads(raw); obs=o.get('observed',{}); vt=o.get('validity_thresholds',{})
          ok=bool(o.get('iteration')==439 and o.get('scientific_gate_pass') is True and
              o.get('authority_scope')=='DIAGNOSTIC_ONLY__ITERATION270_ACOEF_SIGNED_SUM_CONDITIONING' and
              o.get('classification')=='PASS_ITER270_ACOEF_CANCELLATION_DIAGNOSTIC__NON_PROMOTING' and
              vt.get('required_node_count')==26 and vt.get('required_subset_count')==7 and float(vt.get('explicit_vs_parent_Acoef_scaled_max'))==1e-12 and
              obs.get('node_count')==26 and obs.get('subset_count')==7 and obs.get('all_values_finite') is True)
          audit={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':439,'authority_scope':'DIAGNOSTIC_ONLY__ITERATION270_ACOEF_SIGNED_SUM_CONDITIONING','classification':o.get('classification'),'scientific_authority_pass':ok,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (root/'iteration439_authority_audit.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload raw Iteration 439 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iteration439-iter270-acoef-cancellation-diagnostic
          path: candidate_gravity/artifacts/iteration439/
          if-no-files-found: error
          retention-days: 90
