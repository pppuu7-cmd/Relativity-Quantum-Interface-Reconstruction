name: rqir-iteration308-e2c1-placement-nullsoft-audit

on:
  push:
    branches: [main]
    paths:
      - 'candidate_gravity/code/iteration308_e2c1_cubic_placement_nullsoft_audit.py'
      - 'candidate_gravity/code/iteration298_validate_action_result.py'
      - '.github/workflows/rqir-iteration308-e2c1-placement-nullsoft-audit.yml'
  workflow_dispatch:

jobs:
  iteration308:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Iteration 308 e2c1 placement/null-soft audit
        shell: bash
        run: |
          set -euo pipefail
          python candidate_gravity/code/iteration308_e2c1_cubic_placement_nullsoft_audit.py > iteration308_result.json
      - name: Validate Iteration 308 authority sentinel/schema
        shell: bash
        run: |
          set -euo pipefail
          python candidate_gravity/code/iteration298_validate_action_result.py \
            iteration308_result.json \
            --expected-iteration 308 \
            --output iteration308_authority_audit.json
      - name: Upload Iteration 308 result
        uses: actions/upload-artifact@v4
        with:
          name: iteration308-result
          path: |
            iteration308_result.json
            iteration308_authority_audit.json
          if-no-files-found: error
