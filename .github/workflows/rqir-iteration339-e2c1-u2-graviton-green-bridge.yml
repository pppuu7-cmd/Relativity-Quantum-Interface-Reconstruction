name: rqir-iteration339-e2c1-u2-graviton-green-bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration339_e2c1_u2_graviton_green_bridge.py'
      - '.github/workflows/rqir-iteration339-e2c1-u2-graviton-green-bridge.yml'

jobs:
  iteration339:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run U2 graviton Green routing bridge
        run: python candidate_gravity/code/iteration339_e2c1_u2_graviton_green_bridge.py > iteration339_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration339_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==339 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':339,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==339,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration339_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration339-result
          path: |
            iteration339_result.json
            iteration339_authority_audit.json
