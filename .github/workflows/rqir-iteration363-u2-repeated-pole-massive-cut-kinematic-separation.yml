name: rqir-iteration363-u2-repeated-pole-massive-cut-kinematic-separation

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration363_u2_repeated_pole_massive_cut_kinematic_separation.py'
      - '.github/workflows/rqir-iteration363-u2-repeated-pole-massive-cut-kinematic-separation.yml'

jobs:
  iteration363:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run repeated-pole massive-cut kinematic gate
        run: python candidate_gravity/code/iteration363_u2_repeated_pole_massive_cut_kinematic_separation.py > iteration363_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration363_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==363 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':363,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==363,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration363_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration363-result
          path: |
            iteration363_result.json
            iteration363_authority_audit.json