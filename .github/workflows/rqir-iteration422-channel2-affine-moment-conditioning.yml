name: rqir-iteration422-channel2-affine-moment-conditioning

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration422_channel2_affine_moment_conditioning_audit.py'
      - '.github/workflows/rqir-iteration422-channel2-affine-moment-conditioning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration422:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy mpmath
      - name: Run affine-moment conditioning audit
        run: |
          root="candidate_gravity/artifacts/iteration422"
          mkdir -p "$root"
          python candidate_gravity/code/iteration422_channel2_affine_moment_conditioning_audit.py > "$root/iteration422_result.json"
      - name: Raw parse and authority audit
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/iteration422'); p=root/'iteration422_result.json'
          if not p.exists() or p.stat().st_size==0: raise SystemExit(2)
          raw=p.read_bytes(); o=json.loads(raw); t=o.get('target',{}); env=o.get('mass_envelope',{}); th=o.get('thresholds',{})
          ok=bool(o.get('iteration')==422 and o.get('scientific_gate_pass') is True and o.get('authority_scope')=='DIAGNOSTIC_ONLY__NO_PHYSICAL_COORDINATE_PROMOTION' and t.get('double_double_global_index')==2 and t.get('class_id')==3 and abs(float(t.get('q_squared'))+1.0)<1e-12 and abs(float(env.get('radius'))-1e-5)<1e-18 and env.get('pair_count')==64 and th.get('moment_scaled_discrepancy_max')==1e-10 and th.get('vandermonde_condition_number_max')==1000.0)
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':422,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'classification':o.get('classification'),'scientific_authority_pass':ok}
          (root/'iteration422_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration422-channel2-affine-moment-conditioning
          path: candidate_gravity/artifacts/iteration422/
          if-no-files-found: warn
          retention-days: 90
