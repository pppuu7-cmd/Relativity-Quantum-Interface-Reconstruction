name: rqir-iteration375-tru1sq-repeated-cut-auxmass-oracle

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration375_tru1sq_repeated_cut_auxmass_distribution_oracle.py'
      - '.github/workflows/rqir-iteration375-tru1sq-repeated-cut-auxmass-oracle.yml'

jobs:
  iteration375:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: pip install numpy scipy
      - name: Run TrU1sq repeated-cut auxiliary-mass distribution oracle
        run: python candidate_gravity/code/iteration375_tru1sq_repeated_cut_auxmass_distribution_oracle.py > iteration375_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration375_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==375 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':375,'found_iterations':[o.get('iteration')],
             'top_level_object_count':1,'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==375,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration375_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration375-result
          path: |
            iteration375_result.json
            iteration375_authority_audit.json
