name: rqir-iteration351-u2-timelike-30route-structural-census

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration351_u2_timelike_30route_structural_census.py'
      - '.github/workflows/rqir-iteration351-u2-timelike-30route-structural-census.yml'

jobs:
  iteration351:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run timelike 30-route structural census
        run: python candidate_gravity/code/iteration351_u2_timelike_30route_structural_census.py > iteration351_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration351_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==351 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':351,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==351,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration351_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration351-result
          path: |
            iteration351_result.json
            iteration351_authority_audit.json
