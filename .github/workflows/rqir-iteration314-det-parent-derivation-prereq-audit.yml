name: rqir-iteration314-det-parent-derivation-prereq-audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration314_det_parent_derivation_prereq_audit.py'
      - '.github/workflows/rqir-iteration314-det-parent-derivation-prereq-audit.yml'

jobs:
  iteration314:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed parent derivation prerequisite audit
        run: python candidate_gravity/code/iteration314_det_parent_derivation_prereq_audit.py > iteration314_result.json
      - name: Authority schema/sentinel audit
        run: |
          python - <<'PY'
          import json,hashlib
          p='iteration314_result.json'; raw=open(p,'rb').read(); obj=json.loads(raw)
          ok=isinstance(obj,dict) and obj.get('iteration')==314 and 'scientific_gate_pass' in obj and 'missing_prerequisites' in obj
          audit={'schema':'rqir_action_result_authority_audit_v1','path':p,'expected_iteration':314,
                 'found_iterations':[obj.get('iteration')],'top_level_object_count':1,
                 'valid_single_top_level':True,'valid_expected_iteration':obj.get('iteration')==314,
                 'scientific_authority_pass':bool(ok and obj.get('scientific_gate_pass')),
                 'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration314_authority_audit.json','w').write(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          assert ok, audit
          PY
      - name: Upload raw scientific evidence
        uses: actions/upload-artifact@v4
        with:
          name: iteration314-result
          path: |
            iteration314_result.json
            iteration314_authority_audit.json
      - name: Enforce audit gate
        run: python -c "import json; o=json.load(open('iteration314_result.json')); assert o['scientific_gate_pass'], o['classification']"
