name: RQIR Iter588 fixture-bound source K1 K2 routing
on:
  push:
    branches: [ main ]
    paths:
      - 'analysis/source_k1_k2_fixture_binding_iteration588.py'
      - '.github/workflows/rqir-iteration588-source-fixture-binding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run frozen Iter582 fixture source binding
        run: python analysis/source_k1_k2_fixture_binding_iteration588.py
      - name: Fail-closed raw authority audit
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('results/iteration588_source_k1_k2_fixture_binding'); r=d/'result.json'; a=d/'authority_audit.json'
          o=json.loads(r.read_text()); au=json.loads(a.read_text()); sha=hashlib.sha256(r.read_bytes()).hexdigest(); f=[]
          if o.get('iteration')!=588: f.append('iteration drift')
          if o.get('classification')!='PASS_ITER582_FIXTURE_BOUND_MSSC_K1_K2_ROUTING_CONTRACT__NON_RESIDUAL': f.append('classification not pass')
          if o.get('failures')!=[] or not o.get('scientific_gate_pass'): f.append('scientific failure')
          if [x['output_singleton'] for x in o.get('rows',[])]!=['s','a','b']: f.append('frozen singleton order drift')
          if o.get('source_born_subtraction')!='NOT_PERFORMED': f.append('premature subtraction')
          if o.get('ANSATZ_003')!='FORBIDDEN' or o.get('Fisher_resources')!='FORBIDDEN': f.append('guardrail drift')
          if au.get('result_sha256')!=sha or au.get('classification')!='PASS_RAW_AUTHORITY_AUDIT_ITER588_SOURCE_FIXTURE_BINDING': f.append('audit binding drift')
          if f: raise SystemExit('\n'.join(f))
          print('PASS Iter588 raw audit',sha)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rqir-iter588-source-fixture-binding
          path: results/iteration588_source_k1_k2_fixture_binding/
          retention-days: 30
