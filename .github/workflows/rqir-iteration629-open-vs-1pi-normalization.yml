name: RQIR Iter629 open response versus 1PI normalization

on:
  push:
    paths:
      - '.github/workflows/rqir-iteration629-open-vs-1pi-normalization.yml'
      - 'candidate_gravity/code/iteration629_open_vs_1pi_normalization_gate.py'
      - 'candidate_gravity/results/iteration629_open_vs_1pi_normalization_gate.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Recompute structural gate
        run: python candidate_gravity/code/iteration629_open_vs_1pi_normalization_gate.py > iteration629_runtime.json
      - name: Fail-closed exact audit
        run: |
          python - <<'PY'
          import json
          R=json.load(open('iteration629_runtime.json'))
          C=json.load(open('candidate_gravity/results/iteration629_open_vs_1pi_normalization_gate.json'))
          failures=[]
          if R != C:
            failures.append('runtime != committed result')
          if R.get('single_common_N_native_exists') is not False: failures.append('single N incorrectly allowed')
          if R.get('family_total_coefficient_vectors',{}).get('open_over_closed') != [-1.0,-2.0,-3.0]: failures.append('nonproportionality invariant mismatch')
          for k,v in [('candidate_values_used',False),('N_native_fit',False),('zero_fill',False),('source_born_subtraction','NOT_PERFORMED')]:
            if R.get(k)!=v: failures.append(f'{k} guardrail mismatch')
          A={'iteration':629,'classification':'PASS_RAW_AUTHORITY_AUDIT_ITER629_STRUCTURAL_NORMALIZATION_BLOCKER' if not failures else 'FAIL_RAW_AUTHORITY_AUDIT_ITER629_STRUCTURAL_NORMALIZATION_BLOCKER','failures':failures,'single_common_N_native_exists':False,'candidate_values_used':False,'zero_fill':False}
          json.dump(A,open('iteration629_authority_audit.json','w'),indent=2)
          if failures: raise SystemExit('\n'.join(failures))
          PY
      - name: Upload raw artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iteration629-open-vs-1pi-normalization
          path: |
            iteration629_runtime.json
            iteration629_authority_audit.json
            candidate_gravity/results/iteration629_open_vs_1pi_normalization_gate.json
