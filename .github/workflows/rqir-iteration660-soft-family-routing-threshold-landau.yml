name: RQIR Iter660 Soft Family Routing Threshold Landau

on:
  push:
    branches: [main]
    paths:
      - 'candidate_gravity/verification/iteration660_soft_family_routing_threshold_landau.py'
      - '.github/workflows/rqir-iteration660-soft-family-routing-threshold-landau.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration660-soft-family-routing-threshold-landau:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Evaluate exact soft-family routing threshold Landau gate
        run: python candidate_gravity/verification/iteration660_soft_family_routing_threshold_landau.py
      - name: Fail-closed raw result validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('candidate_gravity/results/iteration660_soft_family_routing_threshold_landau.json').read_text(encoding='utf-8'))
          assert d['iteration'] == 660
          assert d['failures'] == []
          assert d['scientific_gate_pass'] is True
          assert d['MODEL_READINESS'] == '24%'
          assert d['zero_fill_allowed'] is False
          assert d['candidate_numerator_cut_values_read'] is False
          assert d['source_born_subtraction'] == 'NOT_PERFORMED'
          c=d['checks']
          assert c['m2'] == '49/100'
          assert c['two_particle_threshold'] == '49/25'
          assert c['q3_squared_exact_zero'] is True
          assert c['soft_bubble_has_no_massive_two_particle_cut'] is True
          assert c['q1_bubble_threshold_is_4m2'] is True
          assert c['triangle_pair_invariants_identical_as_sets'] is True
          assert c['fixed_eps_positive_alpha_leading_landau_absent'] is True
          assert c['all_three_bubbles_retained'] is True
          assert c['both_triangles_retained'] is True
          print('PASS_RAW_AUTHORITY_AUDIT_ITER660_SOFT_ROUTING_THRESHOLD_LANDAU')
          PY
      - name: Upload raw authority artifact
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iteration660-soft-family-routing-threshold-landau
          path: candidate_gravity/results/iteration660_soft_family_routing_threshold_landau.json
          if-no-files-found: error
          retention-days: 90
