name: rqir-iteration397-tru1sq-double-double-channel4-next-angular-level

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration397_tru1sq_double_double_channel4_next_angular_level.py'
      - '.github/workflows/rqir-iteration397-tru1sq-double-double-channel4-next-angular-level.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration397:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run prospectively frozen next angular level and preserve raw
        shell: bash
        run: |
          mkdir -p candidate_gravity/artifacts/iteration397
          set +e
          python candidate_gravity/code/iteration397_tru1sq_double_double_channel4_next_angular_level.py \
            > candidate_gravity/artifacts/iteration397/iteration397_result.json
          rc=$?
          echo "$rc" > candidate_gravity/artifacts/iteration397/python_exit_code.txt
          exit 0
      - name: Raw parse and authority audit
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/iteration397'); p=root/'iteration397_result.json'; raw=p.read_bytes()
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':397,'expected_channel_index':4,
             'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'scientific_authority_pass':False}
          ok=False
          try:
            o=json.loads(raw)
            a.update({'found_iteration':o.get('iteration'),'found_channel_index':o.get('channel_index'),
                      'classification':o.get('classification'),'status':o.get('status'),'reported_scientific_gate_pass':o.get('scientific_gate_pass')})
            ok=bool(o.get('iteration')==397 and o.get('channel_index')==4 and o.get('source_iteration')==395 and
                    o.get('scientific_gate_pass') is True and o.get('status') in {'CONVERGED','BLOCKED_CONVERGENCE'})
          except Exception as exc: a['parse_error']=repr(exc)
          a['scientific_authority_pass']=ok
          (root/'iteration397_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload targeted raw artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration397-result
          path: candidate_gravity/artifacts/iteration397/
          if-no-files-found: error
          retention-days: 90
