name: rqir-iteration413-tru1sq-channel2-mass-step-refinement

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration413_tru1sq_channel2_mass_step_refinement.py'
      - '.github/workflows/rqir-iteration413-tru1sq-channel2-mass-step-refinement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration413:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run frozen channel2 mass-step refinement
        run: |
          root="candidate_gravity/artifacts/iteration413"
          mkdir -p "$root"
          python candidate_gravity/code/iteration413_tru1sq_channel2_mass_step_refinement.py > "$root/iteration413_result.json"
      - name: Raw parse and authority audit
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/iteration413')
          p=root/'iteration413_result.json'
          if not p.exists() or p.stat().st_size==0:
              raise SystemExit(2)
          raw=p.read_bytes(); o=json.loads(raw); ch=o.get('channel',{}); fr=o.get('frozen_reduction',{}); th=o.get('thresholds',{})
          ok=bool(
              o.get('iteration')==413 and
              o.get('scientific_gate_pass') is True and
              ch.get('double_double_global_index')==2 and
              ch.get('class_id')==3 and
              abs(float(ch.get('q_squared'))+1.0)<1e-12 and
              ch.get('status') in ('CONVERGED','BLOCKED_CONVERGENCE') and
              abs(float(fr.get('base_h'))-2.5e-6)<1e-18 and
              abs(float(fr.get('halfstep_h'))-1.25e-6)<1e-18 and
              th.get('physical_convergence_scaled_max')==2e-05 and
              th.get('direct_original_integrand_crosscheck_scaled_max')==2e-06
          )
          a={
              'schema':'rqir_action_result_authority_audit_v1',
              'expected_iteration':413,
              'target_index':2,
              'bytes':len(raw),
              'sha256':hashlib.sha256(raw).hexdigest(),
              'classification':o.get('classification'),
              'scientific_authority_pass':ok,
          }
          (root/'iteration413_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload physical artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration413-physical-index-2
          path: candidate_gravity/artifacts/iteration413/
          if-no-files-found: warn
          retention-days: 90
