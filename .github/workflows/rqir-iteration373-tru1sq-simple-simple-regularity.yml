name: rqir-iteration373-tru1sq-simple-simple-regularity

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration373_tru1sq_simple_simple_on_shell_regularity.py'
      - '.github/workflows/rqir-iteration373-tru1sq-simple-simple-regularity.yml'

jobs:
  iteration373:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run TrU1sq simple-simple regularity gate
        run: python candidate_gravity/code/iteration373_tru1sq_simple_simple_on_shell_regularity.py > iteration373_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration373_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==373 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':373,'found_iterations':[o.get('iteration')],
             'top_level_object_count':1,'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==373,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration373_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration373-result
          path: |
            iteration373_result.json
            iteration373_authority_audit.json
