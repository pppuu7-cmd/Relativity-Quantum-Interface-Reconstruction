name: RQIR downstream precision-boundary audit stage

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/downstream_precision_boundary_audit_stage.py'
      - '.github/workflows/rqir-downstream-precision-boundary-audit-stage.yml'

permissions:
  contents: read

jobs:
  downstream_precision_boundary_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run source/provenance audit
        run: |
          root="candidate_gravity/artifacts/downstream_precision_boundary_audit_stage"
          mkdir -p "$root"
          python candidate_gravity/code/downstream_precision_boundary_audit_stage.py > "$root/result.json"
      - name: Raw authority audit
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/downstream_precision_boundary_audit_stage'); p=root/'result.json'
          if not p.exists() or p.stat().st_size==0: raise SystemExit(2)
          raw=p.read_bytes(); o=json.loads(raw)
          ok=bool(o.get('stage')=='DOWNSTREAM_PRECISION_BOUNDARY_AUDIT__POST_ITER446__UNNUMBERED_UNTIL_RAW_CONSUME' and o.get('scientific_gate_pass') is True and o.get('numerical_precision_closed') is False and o.get('promotes_physical_coordinate') is False and o.get('iteration407_code_records',0)>=1 and o.get('active_code_records',0)>=1)
          audit={'schema':'rqir_action_result_authority_audit_v1','stage':o.get('stage'),'classification':o.get('classification'),'scientific_authority_pass':ok,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (root/'authority_audit.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload raw source-audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqir-downstream-precision-boundary-audit-stage
          path: candidate_gravity/artifacts/downstream_precision_boundary_audit_stage/
          if-no-files-found: error
          retention-days: 90
