name: rqir-iteration343-u2-functional-transpose-routing

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration343_u2_functional_transpose_momentum_routing.py'
      - '.github/workflows/rqir-iteration343-u2-functional-transpose-routing.yml'

jobs:
  iteration343:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run U2 functional-transpose routing gate
        run: python candidate_gravity/code/iteration343_u2_functional_transpose_momentum_routing.py > iteration343_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration343_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==343 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':343,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==343,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration343_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration343-result
          path: |
            iteration343_result.json
            iteration343_authority_audit.json
