name: rqir-iteration410-tru1sq-blockers2-11-structure-split-recovery

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration410_tru1sq_blockers2_11_structure_split_recovery.py'
      - '.github/workflows/rqir-iteration410-tru1sq-blockers2-11-structure-split-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration410:
    strategy:
      fail-fast: false
      matrix:
        target_index: [2, 11]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_INDEX: ${{ matrix.target_index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run one frozen structural target
        run: |
          mkdir -p candidate_gravity/artifacts/iteration410/index_${TARGET_INDEX}
          python candidate_gravity/code/iteration410_tru1sq_blockers2_11_structure_split_recovery.py > candidate_gravity/artifacts/iteration410/index_${TARGET_INDEX}/iteration410_result.json
      - name: Raw parse and authority audit
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          idx=int(os.environ['TARGET_INDEX'])
          root=pathlib.Path(f'candidate_gravity/artifacts/iteration410/index_{idx}')
          p=root/'iteration410_result.json'; raw=p.read_bytes(); o=json.loads(raw)
          t=o.get('target',{})
          c=o.get('classification','')
          ok=bool(o.get('iteration')==410 and o.get('scientific_gate_pass') is True and
                  t.get('double_double_global_index')==idx and t.get('structure_status') in ('PASS','BLOCKED') and
                  c in (f'PASS_TRU1SQ_BLOCKER{idx}_ANALYTIC_AZIMUTH_STRUCTURE_SPLIT_RECOVERY',
                        f'BLOCKED_TRU1SQ_BLOCKER{idx}_ANALYTIC_AZIMUTH_STRUCTURE_SPLIT_RECOVERY') and
                  t.get('remaining_uncut_group_count')==1)
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':410,'target_index':idx,
             'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'classification':c,
             'scientific_authority_pass':ok}
          (root/'iteration410_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload per-target structure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration410-structure-index-${{ matrix.target_index }}
          path: candidate_gravity/artifacts/iteration410/index_${{ matrix.target_index }}/
          if-no-files-found: error
          retention-days: 90
