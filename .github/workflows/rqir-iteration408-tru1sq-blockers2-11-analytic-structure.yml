name: rqir-iteration408-tru1sq-blockers2-11-analytic-structure

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration408_tru1sq_blockers2_11_analytic_structure_oracle.py'
      - '.github/workflows/rqir-iteration408-tru1sq-blockers2-11-analytic-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration408:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run blockers 2 and 11 analytic-azimuth structure oracle
        run: |
          mkdir -p candidate_gravity/artifacts/iteration408
          python candidate_gravity/code/iteration408_tru1sq_blockers2_11_analytic_structure_oracle.py > candidate_gravity/artifacts/iteration408/iteration408_result.json
      - name: Raw parse and authority audit
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/iteration408'); p=root/'iteration408_result.json'; raw=p.read_bytes(); o=json.loads(raw)
          targets=o.get('targets',[]); ids=[x.get('double_double_global_index') for x in targets]
          ok=bool(o.get('iteration')==408 and o.get('scientific_gate_pass') is True and
                  o.get('classification') in ('PASS_TRU1SQ_BLOCKERS2_11_ANALYTIC_AZIMUTH_STRUCTURE_ORACLE','BLOCKED_TRU1SQ_BLOCKERS2_11_ANALYTIC_AZIMUTH_STRUCTURE_ORACLE') and
                  ids==[2,11] and all(x.get('remaining_uncut_group_count')==1 for x in targets))
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':408,'bytes':len(raw),
             'sha256':hashlib.sha256(raw).hexdigest(),'classification':o.get('classification'),'scientific_authority_pass':ok}
          (root/'iteration408_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload structure-oracle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration408-blockers2-11-analytic-azimuth-structure
          path: candidate_gravity/artifacts/iteration408/
          if-no-files-found: error
          retention-days: 90
