name: rqir-iteration416-u2-nullsoft-current-physical-v1-reaudit

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration416_u2_nullsoft_current_physical_v1_reaudit.py'
      - '.github/workflows/rqir-iteration416-u2-nullsoft-current-physical-v1-reaudit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration416:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run original-nullsoft current-physical V1 re-audit
        run: |
          mkdir -p candidate_gravity/artifacts/iteration416
          python candidate_gravity/code/iteration416_u2_nullsoft_current_physical_v1_reaudit.py > candidate_gravity/artifacts/iteration416/iteration416_result.json
      - name: Raw parse and authority audit
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/iteration416'); p=root/'iteration416_result.json'; raw=p.read_bytes(); o=json.loads(raw)
          ok=bool(o.get('iteration')==416 and o.get('scientific_gate_pass') is True and
                  o.get('classification') in (
                    'PASS_U2_ORIGINAL_NULLSOFT_CURRENT_PHYSICAL_V1_REAUDIT__18_SINGLETON_SOFT_KILLS_REPROMOTED__12_SURVIVORS',
                    'PASS_U2_ORIGINAL_NULLSOFT_CURRENT_PHYSICAL_V1_REAUDIT__PRUNING_NOT_REPROMOTED') and
                  o.get('route_authority',{}).get('raw_U2_cubic_placements')==30)
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':416,'bytes':len(raw),
             'sha256':hashlib.sha256(raw).hexdigest(),'classification':o.get('classification'),'scientific_authority_pass':ok}
          (root/'iteration416_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload null-soft re-audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration416-u2-nullsoft-current-physical-v1-reaudit
          path: candidate_gravity/artifacts/iteration416/
          if-no-files-found: error
          retention-days: 90
