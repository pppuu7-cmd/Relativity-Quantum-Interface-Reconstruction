name: RQIR Iter662 plus-TT quarter-turn selection rule

on:
  push:
    paths:
      - 'candidate_gravity/verification/iteration662_plus_tt_quarter_turn_selection_rule.py'
      - '.github/workflows/rqir-iteration662-plus-tt-quarter-turn-selection.yml'
  workflow_dispatch:

jobs:
  iteration662-selection-rule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate exact transverse quarter-turn selection rule
        run: python candidate_gravity/verification/iteration662_plus_tt_quarter_turn_selection_rule.py
      - name: Fail-closed raw validation
        run: |
          python - <<'PY'
          import json
          p='candidate_gravity/results/iteration662_plus_tt_quarter_turn_selection_rule.json'
          d=json.load(open(p))
          assert d['iteration']==662
          assert d['scientific_gate_pass'] is True
          assert d['failures']==[]
          assert d['MODEL_READINESS']=='24%'
          assert d['zero_fill'] is False
          assert d['source_born_subtraction']=='NOT_PERFORMED'
          assert d['exact_checks']['R_Hplus_RT_equals_minus_Hplus'] is True
          assert d['exact_checks']['axial_tz_momenta_invariant'] is True
          print('PASS_RAW_AUDIT_ITER662',d['classification'])
          PY
      - name: Upload raw Iter662 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iteration662-plus-tt-quarter-turn-selection
          path: candidate_gravity/results/iteration662_plus_tt_quarter_turn_selection_rule.json
          if-no-files-found: error
