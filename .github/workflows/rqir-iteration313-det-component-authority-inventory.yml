name: rqir-iteration313-det-component-authority-inventory

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration313_det_component_authority_inventory.py'
      - '.github/workflows/rqir-iteration313-det-component-authority-inventory.yml'

jobs:
  iteration313:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed repository authority inventory
        run: python candidate_gravity/code/iteration313_det_component_authority_inventory.py > iteration313_result.json
      - name: Authority schema/sentinel audit
        run: |
          python - <<'PY'
          import json,hashlib
          p='iteration313_result.json'; raw=open(p,'rb').read(); obj=json.loads(raw)
          ok=isinstance(obj,dict) and obj.get('iteration')==313 and 'scientific_gate_pass' in obj
          audit={'schema':'rqir_action_result_authority_audit_v1','path':p,'expected_iteration':313,
                 'found_iterations':[obj.get('iteration')],'top_level_object_count':1,
                 'valid_single_top_level':True,'valid_expected_iteration':obj.get('iteration')==313,
                 'scientific_authority_pass':bool(ok and obj.get('scientific_gate_pass')),
                 'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration313_authority_audit.json','w').write(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          assert ok, audit
          PY
      - name: Upload raw scientific evidence
        uses: actions/upload-artifact@v4
        with:
          name: iteration313-result
          path: |
            iteration313_result.json
            iteration313_authority_audit.json
      - name: Enforce inventory gate
        run: python -c "import json; o=json.load(open('iteration313_result.json')); assert o['scientific_gate_pass'], o['classification']"
