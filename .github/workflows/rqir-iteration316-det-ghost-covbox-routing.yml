name: rqir-iteration316-det-ghost-covbox-routing

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration316_det_ghost_covbox_routing.py'
      - '.github/workflows/rqir-iteration316-det-ghost-covbox-routing.yml'

jobs:
  iteration316:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Run routed ghost covariant Box completion
        run: python candidate_gravity/code/iteration316_det_ghost_covbox_routing.py > iteration316_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          p='iteration316_result.json'; raw=open(p,'rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==316 and 'scientific_gate_pass' in o
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':316,'found_iterations':[o.get('iteration')],
             'top_level_object_count':1,'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==316,
             'scientific_authority_pass':bool(ok and o.get('scientific_gate_pass')),
             'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration316_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok,a
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration316-result
          path: |
            iteration316_result.json
            iteration316_authority_audit.json
      - name: Enforce scientific gate
        run: python -c "import json; o=json.load(open('iteration316_result.json')); assert o['scientific_gate_pass'], (o['classification'],o.get('validation_max_abs_error_by_order'))"
