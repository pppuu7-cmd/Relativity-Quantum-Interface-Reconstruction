name: rqir-iteration394-u2-remaining7-topology-masked-recovery

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration394_u2_remaining7_topology_masked_recovery_chunk.py'
      - '.github/workflows/rqir-iteration394-u2-remaining7-topology-masked-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration394:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {start: 24, end: 26, label: '24-25'}
          - {start: 26, end: 28, label: '26-27'}
          - {start: 32, end: 34, label: '32-33'}
          - {start: 36, end: 38, label: '36-37'}
          - {start: 38, end: 40, label: '38-39'}
          - {start: 42, end: 44, label: '42-43'}
          - {start: 44, end: 46, label: '44-45'}
    name: iteration394 ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run remaining topology-masked recovery and preserve raw
        id: compute
        shell: bash
        env:
          START_INDEX: ${{ matrix.start }}
          END_INDEX: ${{ matrix.end }}
          LABEL: ${{ matrix.label }}
        run: |
          mkdir -p candidate_gravity/artifacts/iteration394/${LABEL}
          set +e
          python candidate_gravity/code/iteration394_u2_remaining7_topology_masked_recovery_chunk.py \
            > candidate_gravity/artifacts/iteration394/${LABEL}/iteration394_result.json
          rc=$?
          echo "$rc" > candidate_gravity/artifacts/iteration394/${LABEL}/python_exit_code.txt
          echo "python_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Raw parse and provenance audit
        shell: bash
        env:
          START_INDEX: ${{ matrix.start }}
          LABEL: ${{ matrix.label }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          s=int(os.environ['START_INDEX']); label=os.environ['LABEL']; root=pathlib.Path(f'candidate_gravity/artifacts/iteration394/{label}')
          p=root/'iteration394_result.json'; raw=p.read_bytes()
          audit={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':394,'expected_indices':[s,s+1],
                 'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'scientific_authority_pass':False}
          ok=False
          try:
            o=json.loads(raw); recs=o.get('records',[]) if isinstance(o,dict) else []
            inds=[r.get('global_channel_index') for r in recs if isinstance(r,dict)]
            audit.update({'found_iteration':o.get('iteration'),'found_indices':inds,'classification':o.get('classification'),
                          'reported_scientific_gate_pass':o.get('scientific_gate_pass'),'statuses':[r.get('status') for r in recs]})
            ok=bool(o.get('iteration')==394 and o.get('source_scientific_iteration')==384 and o.get('topology_authority_iteration')==392 and inds==[s,s+1] and o.get('scientific_gate_pass') is True)
          except Exception as exc: audit['parse_error']=repr(exc)
          audit['scientific_authority_pass']=ok
          (root/'iteration394_authority_audit.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload raw recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration394-${{ matrix.label }}
          path: candidate_gravity/artifacts/iteration394/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 90
