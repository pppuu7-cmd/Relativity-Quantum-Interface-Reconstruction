name: rqir-iteration417-tru1sq-nullsoft-current-physical-v2-reaudit

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration417_tru1sq_nullsoft_current_physical_v2_reaudit.py'
      - '.github/workflows/rqir-iteration417-tru1sq-nullsoft-current-physical-v2-reaudit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration417:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run original-nullsoft current-physical V2 re-audit
        run: |
          mkdir -p candidate_gravity/artifacts/iteration417
          python candidate_gravity/code/iteration417_tru1sq_nullsoft_current_physical_v2_reaudit.py > candidate_gravity/artifacts/iteration417/iteration417_result.json
      - name: Raw parse and authority audit
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/iteration417'); p=root/'iteration417_result.json'; raw=p.read_bytes(); o=json.loads(raw)
          ok=bool(o.get('iteration')==417 and o.get('scientific_gate_pass') is True and
                  o.get('classification') in (
                    'PASS_TRU1SQ_ORIGINAL_NULLSOFT_CURRENT_PHYSICAL_V2_REAUDIT__26_SINGLETON_SOFT_KILLS_REPROMOTED__16_ORDERED_8_CYCLIC_SURVIVORS',
                    'PASS_TRU1SQ_ORIGINAL_NULLSOFT_CURRENT_PHYSICAL_V2_REAUDIT__PRUNING_NOT_REPROMOTED') and
                  o.get('placement_authority',{}).get('raw_TrU1sq_ordered_placements')==42)
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':417,'bytes':len(raw),
             'sha256':hashlib.sha256(raw).hexdigest(),'classification':o.get('classification'),'scientific_authority_pass':ok}
          (root/'iteration417_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload null-soft V2 re-audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration417-tru1sq-nullsoft-current-physical-v2-reaudit
          path: candidate_gravity/artifacts/iteration417/
          if-no-files-found: error
          retention-days: 90
