name: rqir-iteration377-tru1sq-repeated-cut-mass-probe-separation

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration377_tru1sq_repeated_cut_mass_probe_kinematic_separation.py'
      - '.github/workflows/rqir-iteration377-tru1sq-repeated-cut-mass-probe-separation.yml'

jobs:
  iteration377:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run repeated-cut mass-probe kinematic separation gate
        run: python candidate_gravity/code/iteration377_tru1sq_repeated_cut_mass_probe_kinematic_separation.py > iteration377_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration377_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==377 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':377,'found_iteration':o.get('iteration'),
             'valid_single_top_level':True,'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration377_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration377-result
          path: |
            iteration377_result.json
            iteration377_authority_audit.json
