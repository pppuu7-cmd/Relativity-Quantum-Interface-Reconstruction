name: rqir-iteration354-u2-denominator-translation-candidate-census

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration354_u2_denominator_translation_candidate_census.py'
      - '.github/workflows/rqir-iteration354-u2-denominator-translation-candidate-census.yml'

jobs:
  iteration354:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run denominator translation candidate census
        run: python candidate_gravity/code/iteration354_u2_denominator_translation_candidate_census.py > iteration354_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration354_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==354 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':354,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==354,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration354_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration354-result
          path: |
            iteration354_result.json
            iteration354_authority_audit.json
