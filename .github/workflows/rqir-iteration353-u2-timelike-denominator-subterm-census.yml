name: rqir-iteration353-u2-timelike-denominator-subterm-census

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration353_u2_timelike_denominator_subterm_census.py'
      - '.github/workflows/rqir-iteration353-u2-timelike-denominator-subterm-census.yml'

jobs:
  iteration353:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run denominator subterm census
        run: python candidate_gravity/code/iteration353_u2_timelike_denominator_subterm_census.py > iteration353_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration353_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==353 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':353,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==353,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration353_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration353-result
          path: |
            iteration353_result.json
            iteration353_authority_audit.json
