name: RQIR Iter654 soft target vs finite family compatibility audit

on:
  push:
    branches: [main]
    paths:
      - 'candidate_gravity/code/iteration654_soft_target_vs_finite_family_compatibility_audit.py'
      - '.github/workflows/rqir-iteration654-soft-target-vs-finite-family.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Iter654 observable-identity audit
        run: python candidate_gravity/code/iteration654_soft_target_vs_finite_family_compatibility_audit.py
      - name: Validate fail-closed classification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('candidate_gravity/results/iteration654_soft_target_vs_finite_family_compatibility_audit.json').read_text())
          assert d['iteration']==654
          assert d['scientific_gate_pass'] is True
          assert d['candidate_residual'] is False
          assert d['MODEL_READINESS']=='24%'
          assert d['current_family']['soft_leg_present'] is False
          assert d['source_born_subtraction']=='NOT_PERFORMED'
          assert d['native_Y_Tcut_projection']=='NOT_PERFORMED'
          assert d['comparator_quotient']=='NOT_PERFORMED'
          assert d['zero_fill'] is False
          assert d['failures']==[]
          assert d['classification']=='BLOCKED_ITER654_CURRENT_S_WITH_TU_FIXED_CLOSED_GAMMA3_FAMILY_IS_FINITE_MOMENTUM_NOT_FROZEN_SOFT_T_CUT__NEW_PROSPECTIVE_SOFT_KINEMATIC_CONTRACT_REQUIRED_NON_RESIDUAL'
          print(d['classification'])
          PY
      - name: Upload Iter654 raw artifact
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iteration654-soft-target-vs-finite-family-compatibility-audit
          path: candidate_gravity/results/iteration654_soft_target_vs_finite_family_compatibility_audit.json
          if-no-files-found: error
          retention-days: 90
