name: RQIR Iter663 transverse soft Ward authority

on:
  push:
    paths:
      - 'candidate_gravity/verification/iteration663_transverse_soft_ward_authority_audit.py'
      - '.github/workflows/rqir-iteration663-transverse-soft-ward-authority.yml'
  workflow_dispatch:

jobs:
  iteration663-ward-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit transverse soft Ward authority
        run: python candidate_gravity/verification/iteration663_transverse_soft_ward_authority_audit.py
      - name: Fail-closed raw validation
        run: |
          python - <<'PY'
          import json
          p='candidate_gravity/results/iteration663_transverse_soft_ward_authority_audit.json'
          d=json.load(open(p))
          assert d['iteration']==663
          assert d['scientific_gate_pass'] is True
          assert d['failures']==[]
          assert d['blocked'] is True
          assert d['zero_fill'] is False
          assert d['source_born_subtraction']=='NOT_PERFORMED'
          assert d['native_soft_Tcut']=='BLOCKED_W_TRANSVERSE_OPERATOR_UNDEFINED'
          print('PASS_RAW_AUDIT_ITER663',d['classification'])
          PY
      - name: Upload raw Iter663 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iteration663-transverse-soft-ward-authority
          path: candidate_gravity/results/iteration663_transverse_soft_ward_authority_audit.json
          if-no-files-found: error
