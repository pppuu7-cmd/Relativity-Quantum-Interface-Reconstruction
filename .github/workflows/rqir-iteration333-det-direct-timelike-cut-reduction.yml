name: rqir-iteration333-det-direct-timelike-cut-reduction

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration333_det_direct_timelike_cut_reduction.py'
      - '.github/workflows/rqir-iteration333-det-direct-timelike-cut-reduction.yml'

jobs:
  iteration333:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run scoped direct-timelike cut reduction and preserve diagnostics
        run: |
          set +e
          python candidate_gravity/code/iteration333_det_direct_timelike_cut_reduction.py > iteration333_result.json
          code=$?
          echo "$code" > iteration333_scientific_exit_code.txt
          exit 0
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration333_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==333 and 'scientific_gate_pass' in o and len(o.get('bubble_families',[]))==3 and len(o.get('triangle_families',[]))==1
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':333,'found_iterations':[o.get('iteration')],
             'top_level_object_count':1,'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==333,
             'scientific_authority_pass':bool(ok and o.get('scientific_gate_pass')),
             'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),
             'scientific_exit_code':int(open('iteration333_scientific_exit_code.txt').read())}
          open('iteration333_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration333-result
          path: |
            iteration333_result.json
            iteration333_authority_audit.json
            iteration333_scientific_exit_code.txt
      - name: Enforce scientific gate
        run: python -c "import json; o=json.load(open('iteration333_result.json')); assert o['scientific_gate_pass'], o"
