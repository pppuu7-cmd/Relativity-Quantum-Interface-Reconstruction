name: RQIR Iter586 source signature invariant audit
on:
  push:
    branches: [ main ]
    paths:
      - 'analysis/source_signature_invariant_audit_iteration586.py'
      - '.github/workflows/rqir-iteration586-source-signature-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signature-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run signature/source-channel audit
        run: python analysis/source_signature_invariant_audit_iteration586.py
      - name: Fail-closed raw result audit
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('results/iteration586_source_signature_audit'); r=d/'result.json'; a=d/'authority_audit.json'
          o=json.loads(r.read_text()); au=json.loads(a.read_text()); sha=hashlib.sha256(r.read_bytes()).hexdigest(); f=[]
          if o.get('iteration')!=586: f.append('iteration drift')
          if o.get('classification')!='PASS_SIGNATURE_INVARIANT_AUDIT__OFFSHELL_SOURCE_REQUIRED__NON_RESIDUAL': f.append('classification not pass')
          if o.get('failures')!=[] or not o.get('scientific_gate_pass'): f.append('scientific failure')
          if o.get('source_born_subtraction')!='NOT_PERFORMED': f.append('premature subtraction')
          if o.get('ANSATZ_003')!='FORBIDDEN' or o.get('Fisher_resources')!='FORBIDDEN': f.append('guardrail drift')
          if au.get('result_sha256')!=sha or au.get('classification')!='PASS_RAW_AUTHORITY_AUDIT_ITER586_SOURCE_SIGNATURE': f.append('audit binding drift')
          if f: raise SystemExit('\n'.join(f))
          print('PASS Iter586 raw audit',sha)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rqir-iter586-source-signature-audit
          path: results/iteration586_source_signature_audit/
          retention-days: 30
