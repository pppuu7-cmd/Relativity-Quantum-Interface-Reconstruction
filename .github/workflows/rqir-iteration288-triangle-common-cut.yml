name: rqir-iteration288-triangle-common-cut

on:
  push:
    branches: [main]
    paths:
      - 'candidate_gravity/code/iteration288_triangle_common_cut_reduction.py'
      - '.github/workflows/rqir-iteration288-triangle-common-cut.yml'
  workflow_dispatch:

jobs:
  iteration288:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy
      - name: Run Iteration 288 triangle common-cut certificate
        run: |
          python candidate_gravity/code/iteration288_triangle_common_cut_reduction.py | tee iteration288_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: iteration288-result
          path: iteration288_result.json
