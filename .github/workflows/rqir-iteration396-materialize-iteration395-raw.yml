name: rqir-iteration396-materialize-iteration395-raw

on:
  push:
    paths:
      - '.github/workflows/rqir-iteration396-materialize-iteration395-raw.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  iteration396:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact Iteration 395 raw artifact without recomputation
        uses: actions/download-artifact@v4
        with:
          name: iteration395-result
          path: _iteration395_raw
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: pppuu7-cmd/Relativity-Quantum-Interface-Reconstruction
          run-id: 33821555831
      - name: Validate and materialize scientific raw result
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, shutil
          root=pathlib.Path('_iteration395_raw')
          p=root/'iteration395_result.json'
          raw=p.read_bytes(); o=json.loads(raw)
          required=(o.get('iteration')==395 and o.get('channel_index')==4 and
                    o.get('source_iteration')==389 and o.get('scientific_gate_pass') is True and
                    o.get('status') in {'CONVERGED','BLOCKED_CONVERGENCE'})
          if not required:
              raise SystemExit(('iteration395_raw_contract_failed',o.get('iteration'),o.get('channel_index'),o.get('status')))
          dst=pathlib.Path('candidate_gravity/results/iteration395_tru1sq_double_double_channel4_stronger_angular_raw.json')
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_bytes(raw)
          audit={
            'iteration':396,
            'classification':'PASS_MATERIALIZE_ITERATION395_RAW_WITHOUT_RECOMPUTATION',
            'source_run_id':33821555831,
            'source_artifact_id':9918963191,
            'source_artifact_digest':'sha256:ecf6b54dea9a2eb8d0231782015b02335c799baa32d5948b385e11cf3c40d30c',
            'source_raw_sha256':hashlib.sha256(raw).hexdigest(),
            'iteration395_status':o['status'],
            'iteration395_classification':o['classification'],
            'iteration395_D_s_TrU1sq_double_double_channel':o.get('D_s_TrU1sq_double_double_channel'),
            'iteration395_scaled_convergence_error':o.get('scaled_convergence_error'),
            'iteration395_frozen_threshold':o.get('frozen_threshold'),
            'model_readiness_percent':24,
            'scientific_gate_pass':True,
            'candidate_residual':False,
            'guardrails':['NO_RECOMPUTATION','NO_THRESHOLD_WEAKENING','NO_ZERO_FILL','NO_EFFECTIVE_ACTION_WEIGHT_FOLDING','NO_ANSATZ003','NO_FISHER_RESOURCES']
          }
          pathlib.Path('candidate_gravity/results/iteration396_materialize_iteration395_raw.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          print(json.dumps(audit,indent=2,sort_keys=True))
          PY
      - name: Commit provenance-preserved raw result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add candidate_gravity/results/iteration395_tru1sq_double_double_channel4_stronger_angular_raw.json candidate_gravity/results/iteration396_materialize_iteration395_raw.json
          git commit -m 'Materialize Iteration 395 raw scientific result (Iteration 396)'
          git pull --rebase origin main
          git push origin HEAD:main
