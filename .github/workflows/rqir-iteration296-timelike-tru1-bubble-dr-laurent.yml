name: rqir-iteration296-timelike-tru1-bubble-dr-laurent

on:
  push:
    branches: [main]
    paths:
      - 'candidate_gravity/code/iteration296_timelike_tru1_bubble_dr_laurent.py'
      - '.github/workflows/rqir-iteration296-timelike-tru1-bubble-dr-laurent.yml'
  workflow_dispatch:

jobs:
  iteration296:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Run direct timelike TrU1 bubble DR Laurent reduction
        run: |
          python candidate_gravity/code/iteration296_timelike_tru1_bubble_dr_laurent.py | tee iteration296_result.json
      - name: Upload Iteration 296 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration296-result
          path: iteration296_result.json
          if-no-files-found: error
