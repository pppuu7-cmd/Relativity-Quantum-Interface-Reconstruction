name: rqir-iteration296-timelike-tru1-bubble-dr-laurent

on:
  push:
    branches: [main]
    paths:
      - 'candidate_gravity/code/iteration296_timelike_tru1_bubble_dr_laurent.py'
      - 'candidate_gravity/code/iteration298_validate_action_result.py'
      - '.github/workflows/rqir-iteration296-timelike-tru1-bubble-dr-laurent.yml'
  workflow_dispatch:

jobs:
  iteration296:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Run direct timelike TrU1 bubble DR Laurent reduction fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python candidate_gravity/code/iteration296_timelike_tru1_bubble_dr_laurent.py > iteration296_stdout.log
      - name: Extract exactly one Iteration 296 scientific payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('iteration296_stdout.log')
          text = path.read_text(encoding='utf-8')
          decoder = json.JSONDecoder()
          objects = []
          i = 0
          while True:
              while i < len(text) and text[i].isspace():
                  i += 1
              if i >= len(text):
                  break
              obj, end = decoder.raw_decode(text, i)
              objects.append(obj)
              i = end

          matches = [o for o in objects if isinstance(o, dict) and o.get('iteration') == 296]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one iteration=296 payload, found {len(matches)}; sentinels={[o.get("iteration") if isinstance(o, dict) else None for o in objects]}')
          Path('iteration296_result.json').write_text(
              json.dumps(matches[0], indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
      - name: Validate Iteration 296 scientific artifact authority
        shell: bash
        run: |
          set -euo pipefail
          python candidate_gravity/code/iteration298_validate_action_result.py \
            iteration296_result.json \
            --expected-iteration 296 \
            --output iteration296_authority_audit.json
      - name: Upload Iteration 296 scientific result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iteration296-result
          path: |
            iteration296_result.json
            iteration296_authority_audit.json
          if-no-files-found: error
      - name: Upload Iteration 296 diagnostic stdout on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iteration296-diagnostic
          path: iteration296_stdout.log
          if-no-files-found: warn
