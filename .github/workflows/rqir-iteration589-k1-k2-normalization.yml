name: RQIR Iter589 MSSC K1 K2 normalization
on:
  push:
    branches: [ main ]
    paths:
      - 'analysis/source_k1_k2_normalization_iteration589.py'
      - '.github/workflows/rqir-iteration589-k1-k2-normalization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  normalization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run same-action K1 K2 normalization audit
        run: python analysis/source_k1_k2_normalization_iteration589.py
      - name: Fail-closed raw authority audit
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('results/iteration589_source_k1_k2_normalization'); r=d/'result.json'; a=d/'authority_audit.json'
          o=json.loads(r.read_text()); au=json.loads(a.read_text()); sha=hashlib.sha256(r.read_bytes()).hexdigest(); f=[]
          if o.get('iteration')!=589: f.append('iteration drift')
          if o.get('classification')!='PASS_MSSC001_K1_K2_SAME_ACTION_NORMALIZATION_CONTRACT__NON_RESIDUAL': f.append('classification not pass')
          if o.get('failures')!=[] or not o.get('scientific_gate_pass'): f.append('scientific failure')
          ad=o.get('audit',{})
          if float(ad.get('max_K1_minus_half_hV_abs',1))>2e-12: f.append('K1 normalization drift')
          if float(ad.get('max_pure_gauge_Ward_abs',1))>2e-12: f.append('Ward normalization drift')
          if [x.get('singleton') for x in o.get('iter368_iter588_fixture_K2_values',[])]!=['s','a','b']: f.append('fixture order drift')
          if o.get('source_born_subtraction')!='NOT_PERFORMED': f.append('premature subtraction')
          if o.get('ANSATZ_003')!='FORBIDDEN' or o.get('Fisher_resources')!='FORBIDDEN': f.append('guardrail drift')
          if au.get('result_sha256')!=sha or au.get('classification')!='PASS_RAW_AUTHORITY_AUDIT_ITER589_K1_K2_NORMALIZATION' or au.get('failures')!=[]: f.append('audit binding drift')
          if f: raise SystemExit('\n'.join(f))
          print('PASS Iter589 raw audit',sha)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rqir-iter589-k1-k2-normalization
          path: results/iteration589_source_k1_k2_normalization/
          retention-days: 30
