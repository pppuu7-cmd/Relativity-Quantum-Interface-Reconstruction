name: RQIR Iteration 438 Iter270 A_finite multiprecision core

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration438_iter270_a_finite_multiprecision_core.py'
      - '.github/workflows/rqir-iteration438-iter270-a-finite-multiprecision-core.yml'

permissions:
  contents: read

jobs:
  iteration438:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check -q numpy==2.1.3 mpmath==1.3.0
      - name: Run Iteration 438 A_finite multiprecision core
        run: |
          root="candidate_gravity/artifacts/iteration438"
          mkdir -p "$root"
          python candidate_gravity/code/iteration438_iter270_a_finite_multiprecision_core.py > "$root/iteration438_result.json"
      - name: Raw authority audit
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/iteration438'); p=root/'iteration438_result.json'
          if not p.exists() or p.stat().st_size==0: raise SystemExit(2)
          raw=p.read_bytes(); o=json.loads(raw); obs=o.get('observed',{}); th=o.get('thresholds',{}); fi=o.get('frozen_inputs',{})
          ok=bool(
              o.get('iteration')==438 and o.get('scientific_gate_pass') is True and
              o.get('authority_scope')=='PARENT_PRECISION_CLOSURE__ITERATION270_A_FINITE_CORE_ONLY__NON_PROMOTING' and
              o.get('classification')=='PASS_ITER270_A_FINITE_80_120_DIGIT_ARITHMETIC_CORE__NON_PROMOTING' and
              o.get('precision_levels_decimal_digits')==[80,120] and
              th.get('mp80_vs_mp120_A_finite_scaled_max')=='1e-40' and
              float(th.get('binary64_vs_mp120_A_finite_scaled_max'))==1e-9 and
              obs.get('all_values_finite') is True and obs.get('node_count')==26 and obs.get('subset_count')==7 and
              fi.get('node_count')==26 and fi.get('subset_count')==7
          )
          audit={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':438,'authority_scope':'PARENT_PRECISION_CLOSURE__ITERATION270_A_FINITE_CORE_ONLY__NON_PROMOTING','classification':o.get('classification'),'scientific_authority_pass':ok,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (root/'iteration438_authority_audit.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload raw Iteration 438 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iteration438-iter270-a-finite-multiprecision-core
          path: candidate_gravity/artifacts/iteration438/
          if-no-files-found: error
          retention-days: 90
