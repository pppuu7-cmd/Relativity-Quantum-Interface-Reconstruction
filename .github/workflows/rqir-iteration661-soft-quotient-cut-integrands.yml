name: RQIR Iter661 soft quotient cut integrands

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration661_soft_quotient_cut_integrands.py'
      - '.github/workflows/rqir-iteration661-soft-quotient-cut-integrands.yml'
  workflow_dispatch:

jobs:
  iteration661-soft-quotient-cut-integrands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Evaluate fixed-epsilon quotient-safe numerator-weighted D_s integrands
        run: python candidate_gravity/code/iteration661_soft_quotient_cut_integrands.py
      - name: Fail-closed raw result validation
        run: |
          python - <<'PY'
          import json
          p='candidate_gravity/results/iteration661_soft_quotient_cut_integrands.json'
          d=json.load(open(p))
          assert d['iteration']==661
          assert d['MODEL_READINESS']=='24%'
          assert d['failures']==[]
          assert d['zero_fill'] is False
          assert d['source_born_subtraction']=='NOT_PERFORMED'
          assert d['candidate_values_used'] is False
          assert len(d['samples'])==6
          # BLOCKED on an encountered uncut triangle pole is a valid retained scientific result.
          assert d['scientific_gate_pass'] is True or d['classification'].startswith('BLOCKED_ITER661_')
          print('PASS_RAW_AUDIT_ITER661',d['classification'])
          PY
      - name: Upload raw Iter661 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iteration661-soft-quotient-cut-integrands
          path: candidate_gravity/results/iteration661_soft_quotient_cut_integrands.json
          if-no-files-found: error
