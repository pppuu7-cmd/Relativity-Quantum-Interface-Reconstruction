name: RQIR Iter661 soft quotient cut integrands

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration661_soft_quotient_cut_integrands.py'
      - 'candidate_gravity/results/iteration655_soft_tcut_kinematic_contract.json'
      - 'candidate_gravity/results/iteration658_plus_tt_null_quotient_invariance.json'
      - 'candidate_gravity/results/iteration659_soft_gamma3_cut_topology_census.json'
      - 'candidate_gravity/results/iteration660_soft_family_routing_threshold_landau.json'
      - '.github/workflows/rqir-iteration661-soft-quotient-cut-integrands.yml'
  workflow_dispatch:

jobs:
  iteration661-soft-quotient-cut-integrands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Evaluate fixed-epsilon quotient-safe numerator-weighted D_s integrands
        id: evaluate
        shell: bash
        run: |
          set +e
          python candidate_gravity/code/iteration661_soft_quotient_cut_integrands.py > iteration661_stdout.txt 2> iteration661_stderr.txt
          rc=$?
          cat iteration661_stdout.txt
          cat iteration661_stderr.txt >&2
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Fail-closed raw result validation
        shell: bash
        run: |
          test "${{ steps.evaluate.outputs.exit_code }}" = "0"
          python - <<'PY'
          import json
          p='candidate_gravity/results/iteration661_soft_quotient_cut_integrands.json'
          d=json.load(open(p))
          assert d['iteration']==661
          assert d['MODEL_READINESS']=='24%'
          assert d['failures']==[]
          assert d['zero_fill'] is False
          assert d['source_born_subtraction']=='NOT_PERFORMED'
          assert d['candidate_values_used'] is False
          assert len(d['samples'])==6
          assert d['scientific_gate_pass'] is True or d['classification'].startswith('BLOCKED_ITER661_')
          print('PASS_RAW_AUDIT_ITER661',d['classification'])
          PY
      - name: Upload raw Iter661 artifact and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iteration661-soft-quotient-cut-integrands
          path: |
            candidate_gravity/results/iteration661_soft_quotient_cut_integrands.json
            iteration661_stdout.txt
            iteration661_stderr.txt
          if-no-files-found: warn
