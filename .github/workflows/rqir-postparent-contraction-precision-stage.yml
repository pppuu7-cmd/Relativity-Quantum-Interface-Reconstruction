name: RQIR post-parent contraction precision stage

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/postparent_contraction_precision_stage.py'
      - '.github/workflows/rqir-postparent-contraction-precision-stage.yml'

permissions:
  contents: read

jobs:
  postparent_contraction_precision:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check -q numpy==2.1.3 mpmath==1.3.0 scipy==1.14.1
      - name: Run post-parent continuous precision certificate
        run: |
          root="candidate_gravity/artifacts/postparent_contraction_precision_stage"
          mkdir -p "$root"
          python candidate_gravity/code/postparent_contraction_precision_stage.py > "$root/result.json"
      - name: Raw authority audit
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/postparent_contraction_precision_stage'); p=root/'result.json'
          if not p.exists() or p.stat().st_size==0: raise SystemExit(2)
          raw=p.read_bytes(); o=json.loads(raw); obs=o.get('observed',{}); fr=o.get('frozen',{}); th=o.get('thresholds',{})
          ok=bool(o.get('stage')=='POSTPARENT_CONTRACTION_PRECISION_STAGE__POST_ITER445__UNNUMBERED_UNTIL_RAW_CONSUME' and
                  o.get('scientific_gate_pass') is True and
                  o.get('classification')=='PASS_POSTPARENT_CONTINUOUS_MP80_MP120_CONTRACTION_CERTIFICATE__NON_PROMOTING' and
                  fr.get('precision_digits')==[80,120] and fr.get('post_parent_matmuls_per_contraction')==7 and
                  fr.get('trace_operations_per_contraction')==1 and fr.get('representative_contraction_count')==126 and
                  th.get('scaled_mp80_vs_mp120_max')=='1e-30' and th.get('required_contraction_count')==126 and
                  obs.get('contraction_count')==126 and obs.get('all_finite') is True)
          audit={'schema':'rqir_action_result_authority_audit_v1','stage':o.get('stage'),'authority_scope':o.get('authority_scope'),'classification':o.get('classification'),'scientific_authority_pass':ok,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (root/'authority_audit.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload raw post-parent artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqir-postparent-contraction-precision-stage
          path: candidate_gravity/artifacts/postparent_contraction_precision_stage/
          if-no-files-found: error
          retention-days: 90
