name: rqir-iteration366-u2-repeated-family-simple-simple-physical-cut

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration366_u2_repeated_family_simple_simple_physical_cut.py'
      - '.github/workflows/rqir-iteration366-u2-repeated-family-simple-simple-physical-cut.yml'

jobs:
  iteration366:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run repeated-family simple-simple physical cut gate
        run: python candidate_gravity/code/iteration366_u2_repeated_family_simple_simple_physical_cut.py > iteration366_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration366_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==366 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':366,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==366,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration366_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration366-result
          path: |
            iteration366_result.json
            iteration366_authority_audit.json
