name: rqir-iteration348-u2-A12-timelike-common-background

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration348_u2_A12_timelike_common_background.py'
      - '.github/workflows/rqir-iteration348-u2-A12-timelike-common-background.yml'

jobs:
  iteration348:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run matched timelike common-background A1/A2 gate
        run: python candidate_gravity/code/iteration348_u2_A12_timelike_common_background.py > iteration348_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration348_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==348 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':348,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==348,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration348_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration348-result
          path: |
            iteration348_result.json
            iteration348_authority_audit.json
