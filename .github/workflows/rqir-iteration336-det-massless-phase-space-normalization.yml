name: rqir-iteration336-det-massless-phase-space-normalization

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration336_det_massless_two_particle_phase_space_normalization.py'
      - '.github/workflows/rqir-iteration336-det-massless-phase-space-normalization.yml'

jobs:
  iteration336:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run exact phase-space normalization gate
        run: python candidate_gravity/code/iteration336_det_massless_two_particle_phase_space_normalization.py > iteration336_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration336_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==336 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':336,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==336,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration336_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration336-result
          path: |
            iteration336_result.json
            iteration336_authority_audit.json
