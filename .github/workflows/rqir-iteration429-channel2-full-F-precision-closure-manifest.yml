name: rqir-iteration429-channel2-full-F-precision-closure-manifest

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration429_channel2_full_F_precision_closure_manifest.py'
      - '.github/workflows/rqir-iteration429-channel2-full-F-precision-closure-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration429:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full-F precision closure manifest
        run: |
          root="candidate_gravity/artifacts/iteration429"
          mkdir -p "$root"
          python candidate_gravity/code/iteration429_channel2_full_F_precision_closure_manifest.py > "$root/iteration429_result.json"
      - name: Raw parse and authority audit
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/iteration429'); p=root/'iteration429_result.json'
          if not p.exists() or p.stat().st_size==0: raise SystemExit(2)
          raw=p.read_bytes(); o=json.loads(raw); t=o.get('target',{})
          ok=bool(
              o.get('iteration')==429 and o.get('scientific_gate_pass') is True and
              o.get('classification')=='PASS_CHANNEL2_FULL_F_PRECISION_CLOSURE_MANIFEST__NON_PROMOTING' and
              o.get('authority_scope')=='IMPLEMENTATION_MANIFEST__NO_PHYSICAL_COORDINATE_PROMOTION' and
              o.get('dependency_chain')==['407','379','374','370','368'] and
              t.get('double_double_global_index')==2 and t.get('class_id')==3 and abs(float(t.get('q_squared'))+1.0)<1e-12 and
              t.get('iteration421_status')=='BLOCKED_CONVERGENCE' and len(o.get('implementation_stages',[]))==5
          )
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':429,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'classification':o.get('classification'),'scientific_authority_pass':ok,'authority_scope':'IMPLEMENTATION_MANIFEST__NO_PHYSICAL_COORDINATE_PROMOTION'}
          (root/'iteration429_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload manifest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration429-channel2-full-F-precision-closure-manifest
          path: candidate_gravity/artifacts/iteration429/
          if-no-files-found: warn
          retention-days: 90
