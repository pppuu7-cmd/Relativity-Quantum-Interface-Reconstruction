name: rqir-iteration326-det-full-cubic-topology-incoming-momentum

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration326_det_full_cubic_topology_incoming_momentum_gate.py'
      - '.github/workflows/rqir-iteration326-det-full-cubic-topology-incoming-momentum.yml'

jobs:
  iteration326:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run full cubic-topology arbitrary-incoming-momentum H/N gate and preserve diagnostics
        run: |
          set +e
          python candidate_gravity/code/iteration326_det_full_cubic_topology_incoming_momentum_gate.py > iteration326_result.json
          code=$?
          echo "$code" > iteration326_scientific_exit_code.txt
          exit 0
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration326_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==326 and 'scientific_gate_pass' in o
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':326,'found_iterations':[o.get('iteration')],'top_level_object_count':1,'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==326,'scientific_authority_pass':bool(ok and o.get('scientific_gate_pass')),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'scientific_exit_code':int(open('iteration326_scientific_exit_code.txt').read())}
          open('iteration326_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration326-result
          path: |
            iteration326_result.json
            iteration326_authority_audit.json
            iteration326_scientific_exit_code.txt
      - name: Enforce scientific gate
        run: python -c "import json; o=json.load(open('iteration326_result.json')); assert o['scientific_gate_pass'], o"
