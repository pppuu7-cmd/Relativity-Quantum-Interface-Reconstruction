name: rqir-iteration391-u2-chunk13-topology-reclassification

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration391_u2_chunk13_topology_reclassification.py'
      - '.github/workflows/rqir-iteration391-u2-chunk13-topology-reclassification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration391:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run topology-aware classification proof
        run: |
          mkdir -p candidate_gravity/artifacts/iteration391
          python candidate_gravity/code/iteration391_u2_chunk13_topology_reclassification.py > candidate_gravity/artifacts/iteration391/iteration391_result.json
      - name: Sentinel audit
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('candidate_gravity/artifacts/iteration391/iteration391_result.json'); raw=p.read_bytes(); o=json.loads(raw)
          ok=bool(o.get('iteration')==391 and o.get('scientific_gate_pass') is True and len(o.get('records',[]))==2 and all(r.get('corrected_status')=='CONVERGED' for r in o['records']))
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':391,'sha256':hashlib.sha256(raw).hexdigest(),
             'scientific_authority_pass':ok,'classification':o.get('classification')}
          pathlib.Path('candidate_gravity/artifacts/iteration391/iteration391_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration391-result
          path: candidate_gravity/artifacts/iteration391/
          if-no-files-found: error
          retention-days: 90
