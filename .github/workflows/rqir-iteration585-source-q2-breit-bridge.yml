name: RQIR Iter585 conserved source q2 Breit bridge
on:
  push:
    branches: [ main ]
    paths:
      - 'analysis/source_q2_breit_bridge_iteration585.py'
      - '.github/workflows/rqir-iteration585-source-q2-breit-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-q2-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run frozen conserved-source q2 bridge
        run: python analysis/source_q2_breit_bridge_iteration585.py
      - name: Fail-closed raw authority audit
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('results/iteration585_source_q2_breit_bridge'); r=d/'result.json'; a=d/'authority_audit.json'
          o=json.loads(r.read_text()); au=json.loads(a.read_text()); sha=hashlib.sha256(r.read_bytes()).hexdigest(); f=[]
          if o.get('iteration')!=585: f.append('iteration drift')
          if o.get('classification')!='PASS_MSSC001_CONSERVED_SOURCE_BREIT_Q2_BRIDGE__NON_RESIDUAL': f.append('scientific classification not pass')
          if o.get('failures')!=[] or not o.get('scientific_gate_pass'): f.append('scientific failures')
          if [x['q_squared'] for x in o.get('rows',[])]!=[-1.0,-0.34,-0.14]: f.append('q2 order/buckets drift')
          if o.get('source_born_subtraction')!='NOT_PERFORMED': f.append('premature subtraction')
          if o.get('ANSATZ_003')!='FORBIDDEN' or o.get('Fisher_resources')!='FORBIDDEN': f.append('guardrail drift')
          if au.get('result_sha256')!=sha or au.get('classification')!='PASS_RAW_AUTHORITY_AUDIT_ITER585_SOURCE_Q2_BRIDGE': f.append('audit binding drift')
          if f: raise SystemExit('\n'.join(f))
          print('PASS Iter585 raw audit',sha)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rqir-iter585-source-q2-breit-bridge
          path: results/iteration585_source_q2_breit_bridge/
          retention-days: 30
