name: rqir-iteration286-triangle-reconstruction

on:
  push:
    branches: [main]
    paths:
      - 'candidate_gravity/code/iteration286_remaining_triangle_reconstruction.py'
      - '.github/workflows/rqir-iteration286-triangle-reconstruction.yml'
  workflow_dispatch:

jobs:
  iteration286:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - name: Run Iteration 286 reconstruction certificate
        run: |
          python candidate_gravity/code/iteration286_remaining_triangle_reconstruction.py | tee iteration286_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: iteration286-result
          path: iteration286_result.json
