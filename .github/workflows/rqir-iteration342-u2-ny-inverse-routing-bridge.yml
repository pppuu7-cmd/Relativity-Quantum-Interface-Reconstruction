name: rqir-iteration342-u2-ny-inverse-routing-bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration342_u2_ny_inverse_routing_bridge.py'
      - '.github/workflows/rqir-iteration342-u2-ny-inverse-routing-bridge.yml'

jobs:
  iteration342:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run U2 N/Y inverse-routing bridge
        run: python candidate_gravity/code/iteration342_u2_ny_inverse_routing_bridge.py > iteration342_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration342_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==342 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':342,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==342,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration342_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration342-result
          path: |
            iteration342_result.json
            iteration342_authority_audit.json
