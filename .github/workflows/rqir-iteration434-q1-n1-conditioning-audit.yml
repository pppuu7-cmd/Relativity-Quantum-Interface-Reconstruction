name: RQIR Iteration 434 Q1 N1 conditioning audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rqir-iteration434-q1-n1-conditioning-audit.yml'
permissions:
  contents: read
jobs:
  q1-n1-conditioning-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy==2.1.3
      - name: Audit frozen Q1 N1 cancellation and dependency layer
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          import numpy as np
          src=pathlib.Path('candidate_gravity/code/iteration270_vd_physical_b3_nonzero.py')
          raw=src.read_bytes(); text=raw.decode(); prefix=text.split('# A-layer certificates.')[0]
          ns={'__name__':'iteration270_prefix'}; exec(compile(prefix,str(src),'exec'),ns)
          h=3e-5; rows=[]; max_ratio=0.0; finite=True
          for x in ns['LEGS']:
              M=ns['POS']; m=[M[x]]; p=ns['P0']
              fp=ns['norb']([h],m,p); fm=ns['norb']([-h],m,p)
              num=fp-fm; scale=np.maximum(np.maximum(np.abs(fp),np.abs(fm)),1e-300)
              ratio=float(np.max((np.abs(fp)+np.abs(fm))/np.maximum(np.abs(num),1e-300)))
              max_ratio=max(max_ratio,ratio)
              n1=ns['N1'](M,x,p,h); q1=ns['Q1'](M,x,p,h)
              finite=finite and bool(np.all(np.isfinite(n1))) and bool(np.all(np.isfinite(q1)))
              rows.append({'leg':x,'h':h,'max_cancellation_amplification':ratio,'n1_norm':float(np.linalg.norm(n1)),'q1_norm':float(np.linalg.norm(q1)),'max_scaled_symmetric_numerator':float(np.max(np.abs(num)/scale))})
          result={'iteration':434,'authority_scope':'DIAGNOSTIC_ONLY__ITERATION270_Q1_N1_CONDITIONING','classification':'PASS_Q1_N1_FROZEN_CONDITIONING_AUDIT__NON_PROMOTING' if finite else 'BLOCKED_Q1_N1_NONFINITE','scientific_gate_pass':bool(finite),'source_sha256':hashlib.sha256(raw).hexdigest(),'frozen_h':h,'rows':rows,'max_cancellation_amplification':max_ratio,'interpretation':'Binds the actual frozen binary64 Q1/N1 finite-difference layer and quantifies symmetric-difference cancellation before an 80/120-digit port. This cannot certify Q1 precision or promote index 2.','next_gate':'Implement Q1/N1 at 80/120 digits on these same frozen inputs and h; require cross-precision agreement before Asub/Acoef/A_finite.','model_readiness_percent':24,'guardrails':['NO_PHYSICAL_DS_VALUE','NO_THRESHOLD_WEAKENING','NO_AUXILIARY_MASS_STEP_CHANGE','NO_ZERO_FILL','NO_ANSATZ003','NO_FISHER_RESOURCES']}
          out=pathlib.Path('iteration434_result.json'); out.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n'); b=out.read_bytes()
          audit={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':434,'authority_scope':'DIAGNOSTIC_ONLY','classification':result['classification'],'scientific_authority_pass':result['scientific_gate_pass'],'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          pathlib.Path('iteration434_authority_audit.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          if not finite: raise SystemExit('BLOCKED: Q1/N1 produced nonfinite output')
          PY
      - name: Raw authority audit
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          b=pathlib.Path('iteration434_result.json').read_bytes(); a=json.loads(pathlib.Path('iteration434_authority_audit.json').read_text()); assert a['sha256']==hashlib.sha256(b).hexdigest(); assert a['bytes']==len(b); assert a['expected_iteration']==434; print(json.dumps(a,indent=2))
          PY
      - name: Upload raw Iteration 434 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iteration434-q1-n1-conditioning-audit
          path: |
            iteration434_result.json
            iteration434_authority_audit.json
          if-no-files-found: error
          retention-days: 30
