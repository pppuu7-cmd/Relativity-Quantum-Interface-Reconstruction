name: rqir-iteration431-channel2-cut-kinematic-h1-sensitivity

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration431_channel2_cut_kinematic_h1_sensitivity.py'
      - '.github/workflows/rqir-iteration431-channel2-cut-kinematic-h1-sensitivity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration431:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run cut-kinematic h1 sensitivity audit
        run: |
          root="candidate_gravity/artifacts/iteration431"
          mkdir -p "$root"
          python candidate_gravity/code/iteration431_channel2_cut_kinematic_h1_sensitivity.py > "$root/iteration431_result.json"
      - name: Raw parse and authority audit
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/iteration431'); p=root/'iteration431_result.json'
          if not p.exists() or p.stat().st_size==0: raise SystemExit(2)
          raw=p.read_bytes(); o=json.loads(raw); t=o.get('target',{}); r=o.get('row_identity',{})
          ok=bool(
              o.get('iteration')==431 and o.get('scientific_gate_pass') is True and
              o.get('authority_scope')=='DIAGNOSTIC_ONLY__NO_PHYSICAL_COORDINATE_PROMOTION' and
              o.get('classification') in (
                  'PASS_CHANNEL2_CUT_KINEMATIC_H1_SENSITIVITY__MATERIAL_DIAGNOSTIC_ONLY',
                  'PASS_CHANNEL2_CUT_KINEMATIC_H1_SENSITIVITY__SUBTHRESHOLD_DIAGNOSTIC_ONLY') and
              t.get('double_double_global_index')==2 and t.get('class_id')==3 and abs(float(t.get('q_squared'))+1.0)<1e-12 and
              r.get('extra_site')=='N_L' and r.get('V2_leg')=='b' and r.get('extra_local_leg')=='a' and
              o.get('h1_base')==0.0001 and o.get('h1_scales')==[0.75,1.0,1.25] and
              o.get('radial_hs')==[0.002,0.001,0.0005]
          )
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':431,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'classification':o.get('classification'),'scientific_authority_pass':ok,'authority_scope':'DIAGNOSTIC_ONLY__NO_PHYSICAL_COORDINATE_PROMOTION'}
          (root/'iteration431_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration431-channel2-cut-kinematic-h1-sensitivity
          path: candidate_gravity/artifacts/iteration431/
          if-no-files-found: warn
          retention-days: 90
