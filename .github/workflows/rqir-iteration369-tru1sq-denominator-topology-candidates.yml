name: rqir-iteration369-tru1sq-denominator-topology-candidates

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration369_tru1sq_timelike_denominator_topology_candidates.py'
      - '.github/workflows/rqir-iteration369-tru1sq-denominator-topology-candidates.yml'

jobs:
  iteration369:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run TrU1sq denominator topology candidate gate
        run: python candidate_gravity/code/iteration369_tru1sq_timelike_denominator_topology_candidates.py > iteration369_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration369_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==369 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':369,'found_iterations':[o.get('iteration')],
             'top_level_object_count':1,'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==369,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration369_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration369-result
          path: |
            iteration369_result.json
            iteration369_authority_audit.json
