name: rqir-iteration350-u2-timelike-nullsoft-survivor-reaudit

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration350_u2_timelike_nullsoft_survivor_reaudit.py'
      - '.github/workflows/rqir-iteration350-u2-timelike-nullsoft-survivor-reaudit.yml'

jobs:
  iteration350:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run timelike null-soft survivor re-audit
        run: python candidate_gravity/code/iteration350_u2_timelike_nullsoft_survivor_reaudit.py > iteration350_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration350_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==350 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':350,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==350,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration350_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration350-result
          path: |
            iteration350_result.json
            iteration350_authority_audit.json
