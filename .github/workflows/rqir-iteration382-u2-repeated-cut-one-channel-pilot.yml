name: rqir-iteration382-u2-repeated-cut-one-channel-pilot

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration382_u2_repeated_cut_one_channel_pilot.py'
      - '.github/workflows/rqir-iteration382-u2-repeated-cut-one-channel-pilot.yml'

jobs:
  iteration382:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run one-channel physical U2 repeated-cut pilot
        run: python candidate_gravity/code/iteration382_u2_repeated_cut_one_channel_pilot.py > iteration382_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration382_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==382 and o.get('scientific_gate_pass') is True
          ch=o.get('channel',{})
          ok=ok and ch.get('global_channel_index')==0 and ch.get('status') in ('CONVERGED','BLOCKED_CONVERGENCE')
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':382,'found_iteration':o.get('iteration'),
             'valid_single_top_level':True,'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration382_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration382-result
          path: |
            iteration382_result.json
            iteration382_authority_audit.json
