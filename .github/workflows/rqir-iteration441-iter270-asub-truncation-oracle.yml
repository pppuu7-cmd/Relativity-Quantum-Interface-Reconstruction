name: RQIR Iteration 441 Iter270 Asub truncation oracle

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration441_iter270_asub_truncation_oracle.py'
      - '.github/workflows/rqir-iteration441-iter270-asub-truncation-oracle.yml'

permissions:
  contents: read

jobs:
  iteration441:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check -q numpy==2.1.3 mpmath==1.3.0
      - name: Run Iteration 441 Asub truncation oracle
        run: |
          root="candidate_gravity/artifacts/iteration441"
          mkdir -p "$root"
          python candidate_gravity/code/iteration441_iter270_asub_truncation_oracle.py > "$root/iteration441_result.json"
      - name: Raw authority audit
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/iteration441'); p=root/'iteration441_result.json'
          if not p.exists() or p.stat().st_size==0: raise SystemExit(2)
          raw=p.read_bytes(); o=json.loads(raw); obs=o.get('observed',{}); th=o.get('thresholds',{})
          ok=bool(o.get('iteration')==441 and o.get('scientific_gate_pass') is True and
              o.get('authority_scope')=='PARENT_REPRESENTATION_CLOSURE__ITERATION270_ASUB_FIXED_H_STENCIL__NON_PROMOTING' and
              o.get('classification')=='PASS_ITER270_ASUB_FIXED_H_FOURTH_ORDER_DERIVATIVE_ORACLE__NON_PROMOTING' and
              th.get('mp80_vs_mp120_highorder_scaled_max')=='1e-30' and th.get('central_vs_highorder_mp120_scaled_max')=='2e-5' and
              th.get('required_highorder_node_count')==124 and th.get('required_subset_count')==7 and
              obs.get('highorder_node_count')==124 and obs.get('subset_count')==7 and obs.get('all_values_finite') is True)
          audit={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':441,'authority_scope':o.get('authority_scope'),'classification':o.get('classification'),'scientific_authority_pass':ok,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (root/'iteration441_authority_audit.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload raw Iteration 441 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iteration441-iter270-asub-truncation-oracle
          path: candidate_gravity/artifacts/iteration441/
          if-no-files-found: error
          retention-days: 90
