name: RQIR post477 frozen-basis geometry MP audit

on:
  push:
    paths:
      - 'candidate_gravity/code/post477_frozen_basis_geometry_mp_audit.py'
      - '.github/workflows/rqir-post477-frozen-basis-geometry-mp-audit.yml'
  workflow_dispatch:

jobs:
  geometry_mp_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy mpmath
      - name: Run frozen-basis geometry MP audit
        run: |
          mkdir -p raw_authority
          python candidate_gravity/code/post477_frozen_basis_geometry_mp_audit.py | tee raw_authority/post477_frozen_basis_geometry_mp_audit.json
      - name: Raw authority audit
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('raw_authority/post477_frozen_basis_geometry_mp_audit.json')
          o=json.loads(p.read_text())
          assert o['scientific_gate_pass'] is True
          assert o['promotes_physical_coordinate'] is False
          assert o['MODEL_READINESS']=='24%'
          assert o['observed']['point_sample_count']==13440
          assert o['thresholds']['mp80_vs_mp120_scaled_max']=='1e-30'
          assert o['frozen']['distinct_mass_coordinates']==28
          print('RAW_AUTHORITY_AUDIT_PASS')
          PY
      - name: Upload raw artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rqir-post477-frozen-basis-geometry-mp-audit
          path: raw_authority/post477_frozen_basis_geometry_mp_audit.json
          if-no-files-found: error
