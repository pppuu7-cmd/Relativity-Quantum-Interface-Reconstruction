name: rqir-iteration341-u2-v1-a12-same-parent-geometry

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration341_u2_v1_a12_same_parent_geometry.py'
      - '.github/workflows/rqir-iteration341-u2-v1-a12-same-parent-geometry.yml'

jobs:
  iteration341:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run physical U2 V1 A1/A2 geometry gate
        run: python candidate_gravity/code/iteration341_u2_v1_a12_same_parent_geometry.py > iteration341_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration341_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==341 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':341,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==341,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration341_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration341-result
          path: |
            iteration341_result.json
            iteration341_authority_audit.json
