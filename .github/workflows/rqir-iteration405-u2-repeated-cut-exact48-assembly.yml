name: rqir-iteration405-u2-repeated-cut-exact48-assembly

on:
  push:
    paths:
      - '.github/workflows/rqir-iteration405-u2-repeated-cut-exact48-assembly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration405:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed exact-48 assembly
        shell: bash
        run: |
          d=candidate_gravity/artifacts/iteration405
          mkdir -p "$d"
          set +e
          python candidate_gravity/code/iteration405_u2_repeated_cut_exact48_assembly.py > "$d/iteration405_result.json"
          rc=$?
          echo "$rc" > "$d/python_exit_code.txt"
          exit 0
      - name: Raw parse and authority audit
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/iteration405')
          p=root/'iteration405_result.json'; raw=p.read_bytes()
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':405,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'scientific_authority_pass':False}
          ok=False
          try:
            o=json.loads(raw)
            a.update({'found_iteration':o.get('iteration'),'classification':o.get('classification'),'reported_scientific_gate_pass':o.get('scientific_gate_pass'),'exact_channel_count':o.get('exact_channel_count')})
            ok=bool(o.get('iteration')==405 and o.get('scientific_gate_pass') is True and o.get('exact_channel_count')==48 and o.get('exact_unique_indices')==list(range(48)))
          except Exception as exc:
            a['parse_error']=repr(exc)
          a['scientific_authority_pass']=ok
          (root/'iteration405_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload Iteration 405 authority artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration405-u2-repeated-cut-exact48
          path: candidate_gravity/artifacts/iteration405/
          if-no-files-found: error
          retention-days: 90
