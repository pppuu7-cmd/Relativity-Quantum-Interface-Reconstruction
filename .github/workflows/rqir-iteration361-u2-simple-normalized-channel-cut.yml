name: rqir-iteration361-u2-simple-normalized-channel-cut

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration361_u2_simple_normalized_channel_cut.py'
      - '.github/workflows/rqir-iteration361-u2-simple-normalized-channel-cut.yml'

jobs:
  iteration361:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run normalized ordinary-simple U2 channel cut
        run: python candidate_gravity/code/iteration361_u2_simple_normalized_channel_cut.py > iteration361_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration361_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==361 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':361,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==361,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration361_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration361-result
          path: |
            iteration361_result.json
            iteration361_authority_audit.json
