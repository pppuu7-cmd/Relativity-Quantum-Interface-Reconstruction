name: paper-i-promote-v05

on:
  push:
    branches: [paper-I-v03-evidence-boundary]
    paths:
      - '.github/workflows/paper-i-promote-v05.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper-I-v03-evidence-boundary

      - name: Promote verified Toy009/Toy010 evidence into manuscript
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('manuscripts/paper_I/main.tex')
          text = path.read_text()
          replacements = [
              (r'\date{Working manuscript v0.4 / 8 September 2026}', r'\date{Working manuscript v0.5 / 8 September 2026}'),
              (r'''The deterministic scans Toy009 and Toy010 are used to test the hypotheses of Proposition~\ref{prop:rqir-thm-001}; they do not replace its proof. The working construction has a 25-dimensional reduced source parameterization and is designed to realize the codimension-one regime $\operatorname{rank}A=24$. Until an immutable clean-run artifact is tied to an exact code revision, these dimensions describe the intended constructive certificate rather than a submission-final numerical measurement.''', r'''The deterministic constructions Toy009 and Toy010 test the hypotheses of Proposition~\ref{prop:rqir-thm-001}; they do not replace its proof. Both use a 25-dimensional Hermitian source parameterization and realize the codimension-one regime $\operatorname{rank}A=24$ under the declared numerical-rank rule. A clean independent GitHub Actions rerun on 8 September 2026, with Python 3.12.14 and NumPy 2.1.3, reproduced the frozen Toy009/Toy010 regression checks at repository commit \texttt{763757788397564d180cfd6b33c28db57412d74c}.'''),
              (r'''Items 1--5 are mathematical or numerical checks of the construction. Item 6 is a provenance requirement for manuscript-level numerical claims. The current working record supports the constructive design, but machine-specific residuals, tolerances and last digits are deliberately withheld from headline evidence until item 6 is complete.''', r'''Items 1--5 are mathematical or numerical checks of the construction. Item 6 is a provenance requirement for manuscript-level numerical claims. All six checks are now satisfied by the frozen clean-run certificate. In Toy009 the maximum equality residual is $2.2\times10^{-16}$, the selected mean/noise differences are below $2\times10^{-18}$, both paired density operators are positive, and the ordered responses are opposite with magnitude approximately $1.21\times10^{-2}$. Keeping the Toy009 source fixed while changing only the finite calibration geometry, Toy010 retains $\operatorname{rank}A=24$, gives a maximum equality residual $4.4\times10^{-16}$, retains positive paired states and equal selected mean/noise coordinates, and produces opposite ordered responses of magnitude approximately $1.33\times10^{-2}$. The normalized null directions of the inherited Toy009 and Toy010 calibrations differ by approximately $37.7^\circ$. These values are finite-dimensional construction diagnostics rather than experimental forecasts or evidence that gravity transmits the corresponding response coordinate.'''),
              (r'''Before submission, every numerical statement and every final plot/table must point to a canonical repository source and a frozen generation script or manifest. For each constructive Toy009/Toy010 claim, the frozen record must contain: (i) the exact code revision and immutable run/artifact identifier; (ii) all nondefault configuration values and either the random seed or a declaration of deterministic execution; (iii) the calibration/steering prescription and numerical precision/tolerance policy; (iv) singular values or an equivalent rank diagnostic together with the numerical-rank rule; (v) the normalized hidden direction; (vi) physical-state and positivity diagnostics; (vii) calibration-equality residuals; and (viii) the ordered and detector-aware response values evaluated on that same frozen direction.''', r'''The Toy009/Toy010 numerical statements are bound to the frozen generation scripts and the clean-run authority recorded in \texttt{manuscripts/paper\_I/TOY009\_TOY010\_REPRO\_MANIFEST.md}. Workflow run \texttt{34177686395} completed successfully at commit \texttt{763757788397564d180cfd6b33c28db57412d74c}; the uploaded certificate artifact is \texttt{paper-i-toy009-toy010-certificate}, artifact ID \texttt{10037815979}, with archive digest \texttt{sha256:6363cfe9f5fad3ad7d04363921cc6d66e051ce7beaf9e22a3940a1b38c654b95}. The record includes the exact code revision, seeds/configuration, Python/NumPy environment, numerical-rank policy, positivity/equality diagnostics, ordered-response values and file hashes. Before submission the temporary Actions artifact will be copied to a long-retention repository or archival record.'''),
              (r'''Any quantity calibrated to or compared with an external source additionally requires the authority record, convention and extraction rule for that source. A manuscript-level numerical statement is promotable only when all fields relevant to its evidence class in Table~\ref{tab:evidence-promotion} are frozen. Missing external authority does not invalidate the analytic theorem; it blocks only promotion of the affected external comparison or calibrated number.''', r'''Any quantity calibrated to or compared with an external source additionally requires the authority record, convention and extraction rule for that source. A manuscript-level external numerical statement is promotable only when all fields relevant to its evidence class in Table~\ref{tab:evidence-promotion} are frozen. Missing external authority does not invalidate the analytic theorem or the internally reproduced Toy009/Toy010 certificate; it blocks only promotion of the affected external comparison or calibrated number.'''),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Commit manuscript v0.5
        run: |
          git diff --check
          git diff -- manuscripts/paper_I/main.tex
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscripts/paper_I/main.tex
          git commit -m 'paper I v0.5: promote clean Toy009/Toy010 certificate'
          git push origin HEAD:paper-I-v03-evidence-boundary
