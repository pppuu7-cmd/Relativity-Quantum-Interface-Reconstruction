name: rqir-iteration334-det-triangle-q2minus1-highres-cut-resolution

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration334_det_triangle_q2minus1_highres_cut_resolution.py'
      - '.github/workflows/rqir-iteration334-det-triangle-q2minus1-highres-cut-resolution.yml'

jobs:
  iteration334:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run high-resolution q2=-1 triangle cut resolution and preserve diagnostics
        run: |
          set +e
          python candidate_gravity/code/iteration334_det_triangle_q2minus1_highres_cut_resolution.py > iteration334_result.json
          code=$?
          echo "$code" > iteration334_scientific_exit_code.txt
          exit 0
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration334_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==334 and 'scientific_gate_pass' in o and 'runs' in o and 'status' in o
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':334,'found_iterations':[o.get('iteration')],
             'top_level_object_count':1,'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==334,
             'scientific_authority_pass':bool(ok and o.get('scientific_gate_pass')),
             'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),
             'scientific_exit_code':int(open('iteration334_scientific_exit_code.txt').read())}
          open('iteration334_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration334-result
          path: |
            iteration334_result.json
            iteration334_authority_audit.json
            iteration334_scientific_exit_code.txt
      - name: Enforce scientific gate
        run: python -c "import json; o=json.load(open('iteration334_result.json')); assert o['scientific_gate_pass'], o"
