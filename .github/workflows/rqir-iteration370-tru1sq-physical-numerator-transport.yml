name: rqir-iteration370-tru1sq-physical-numerator-transport

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration370_tru1sq_timelike_numerator_transport.py'
      - '.github/workflows/rqir-iteration370-tru1sq-physical-numerator-transport.yml'

jobs:
  iteration370:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run TrU1sq physical numerator transport gate
        run: python candidate_gravity/code/iteration370_tru1sq_timelike_numerator_transport.py > iteration370_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration370_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==370 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':370,'found_iterations':[o.get('iteration')],
             'top_level_object_count':1,'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==370,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration370_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration370-result
          path: |
            iteration370_result.json
            iteration370_authority_audit.json
