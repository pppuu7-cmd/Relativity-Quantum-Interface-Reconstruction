name: rqir-iteration364-u2-repeated-pole-symmetric-aux-derivative-cut

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration364_u2_repeated_pole_symmetric_aux_derivative_cut.py'
      - '.github/workflows/rqir-iteration364-u2-repeated-pole-symmetric-aux-derivative-cut.yml'

jobs:
  iteration364:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run physical repeated-pole symmetric derivative cut gate
        run: python candidate_gravity/code/iteration364_u2_repeated_pole_symmetric_aux_derivative_cut.py > iteration364_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration364_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==364 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':364,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==364,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration364_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration364-result
          path: |
            iteration364_result.json
            iteration364_authority_audit.json
