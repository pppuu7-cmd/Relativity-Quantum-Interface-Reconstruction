name: RQIR Iter597 full nonlinear Ward gate

on:
  push:
    branches: [ main ]
    paths:
      - 'analysis/nonlinear_ward_full_response_iteration597.py'
      - '.github/workflows/rqir-iteration597-full-nonlinear-ward.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-ward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run frozen full nonlinear Ward evaluation
        run: python analysis/nonlinear_ward_full_response_iteration597.py
      - name: Fail-closed raw result audit
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('results/iteration597_full_nonlinear_ward')
          r=root/'result.json'; a=root/'authority_audit.json'
          if not r.exists() or not a.exists(): raise SystemExit('missing Iter597 raw outputs')
          result=json.loads(r.read_text()); audit=json.loads(a.read_text()); sha=hashlib.sha256(r.read_bytes()).hexdigest(); failures=[]
          if result.get('iteration') != 597: failures.append('iteration mismatch')
          if result.get('source_born_subtraction') != 'NOT_PERFORMED': failures.append('premature Source/Born subtraction')
          if result.get('source_to_iter582_map') != 'NOT_PERFORMED': failures.append('premature source-to-Iter582 map')
          if result.get('candidate_residual') is not False: failures.append('premature candidate residual')
          if result.get('ANSATZ_003') != 'FORBIDDEN': failures.append('ANSATZ-003 guardrail violation')
          if result.get('Fisher_resources') != 'FORBIDDEN': failures.append('Fisher/resources guardrail violation')
          if audit.get('result_sha256') != sha: failures.append('result sha mismatch')
          valid_classes={
            'PASS_FULL_SOURCE_LEVEL_NONLINEAR_WARD_ON_FROZEN_ITER596_CONTRACT__NON_RESIDUAL',
            'FAIL_FULL_SOURCE_LEVEL_NONLINEAR_WARD_ON_FROZEN_ITER596_CONTRACT__PRESERVED_NEGATIVE_RESULT'}
          if result.get('classification') not in valid_classes: failures.append('unexpected scientific classification')
          if failures: raise SystemExit('\n'.join(failures))
          print('PASS fail-closed Iter597 raw integrity audit',sha,'scientific_classification=',result.get('classification'))
          PY
      - name: Upload raw artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iter597-full-nonlinear-ward
          path: results/iteration597_full_nonlinear_ward/
          if-no-files-found: error
          retention-days: 30
