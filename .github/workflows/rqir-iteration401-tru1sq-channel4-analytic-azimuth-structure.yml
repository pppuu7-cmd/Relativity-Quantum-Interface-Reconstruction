# retrigger-only: no scientific gate or arithmetic change
name: rqir-iteration401-tru1sq-channel4-analytic-azimuth-structure

on:
  push:
    paths:
      - '.github/workflows/rqir-iteration401-tru1sq-channel4-analytic-azimuth-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration401:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run channel-4 analytic-azimuth structure oracle
        run: |
          mkdir -p candidate_gravity/artifacts/iteration401
          python candidate_gravity/code/iteration401_tru1sq_channel4_analytic_azimuth_structure_oracle.py > candidate_gravity/artifacts/iteration401/iteration401_result.json
      - name: Raw parse and authority audit
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/iteration401'); p=root/'iteration401_result.json'; raw=p.read_bytes(); o=json.loads(raw)
          ok=bool(o.get('iteration')==401 and o.get('scientific_gate_pass') is True and
                  o.get('classification') in ('PASS_TRU1SQ_CHANNEL4_ANALYTIC_AZIMUTH_STRUCTURE_ORACLE','BLOCKED_TRU1SQ_CHANNEL4_ANALYTIC_AZIMUTH_STRUCTURE_ORACLE') and
                  o.get('target',{}).get('double_double_global_index')==4 and o.get('target',{}).get('remaining_uncut_group_count')==1)
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':401,'bytes':len(raw),
             'sha256':hashlib.sha256(raw).hexdigest(),'classification':o.get('classification'),'scientific_authority_pass':ok}
          (root/'iteration401_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload structure-oracle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration401-channel4-analytic-azimuth-structure
          path: candidate_gravity/artifacts/iteration401/
          if-no-files-found: error
          retention-days: 90
