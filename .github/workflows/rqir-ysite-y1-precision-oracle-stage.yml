name: RQIR Y-site y1 precision oracle stage

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/ysite_y1_precision_oracle_stage.py'
      - '.github/workflows/rqir-ysite-y1-precision-oracle-stage.yml'

permissions:
  contents: read

jobs:
  ysite_y1_precision_oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check -q numpy==2.1.3 mpmath==1.3.0
      - name: Run frozen Y-site y1 precision oracle
        run: |
          root="candidate_gravity/artifacts/ysite_y1_precision_oracle_stage"
          mkdir -p "$root"
          python candidate_gravity/code/ysite_y1_precision_oracle_stage.py > "$root/result.json"
      - name: Raw authority audit
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/ysite_y1_precision_oracle_stage')
          p=root/'result.json'
          if not p.exists() or p.stat().st_size==0: raise SystemExit(2)
          raw=p.read_bytes(); o=json.loads(raw); obs=o.get('observed',{}); th=o.get('thresholds',{}); fr=o.get('frozen',{})
          ok=bool(
              o.get('stage')=='YSITE_Y1_PRECISION_ORACLE_STAGE__POST_ITER443__UNNUMBERED_UNTIL_RAW_CONSUME' and
              o.get('scientific_gate_pass') is True and
              o.get('authority_scope')=='LAYER368_370_YSITE_Y1_PRECISION_AND_FIXED_H_REPRESENTATION__NON_PROMOTING' and
              o.get('classification')=='PASS_YSITE_Y1_MP80_MP120_AND_FIXED_H_FOURTH_ORDER_ORACLE__NON_PROMOTING' and
              fr.get('h')=='4e-5' and fr.get('precision_digits')==[80,120] and fr.get('pair_count')==3 and
              th.get('central_mp80_vs_mp120_max_abs')=='1e-30' and
              th.get('central_vs_fourth_mp120_scaled_max')=='2e-5' and
              th.get('required_pair_count')==3 and obs.get('pair_count')==3 and obs.get('all_values_finite') is True
          )
          audit={'schema':'rqir_action_result_authority_audit_v1','stage':o.get('stage'),'authority_scope':o.get('authority_scope'),'classification':o.get('classification'),'scientific_authority_pass':ok,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (root/'authority_audit.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload raw Y-site artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqir-ysite-y1-precision-oracle-stage
          path: candidate_gravity/artifacts/ysite_y1_precision_oracle_stage/
          if-no-files-found: error
          retention-days: 90
