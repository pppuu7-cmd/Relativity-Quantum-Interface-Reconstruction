name: rqir-iteration295-timelike-tru1-family-reconstruction

on:
  push:
    branches: [main]
    paths:
      - 'candidate_gravity/code/iteration295_timelike_tru1_family_reconstruction_s0016.py'
      - '.github/workflows/rqir-iteration295-timelike-tru1-family-reconstruction.yml'
  workflow_dispatch:

jobs:
  iteration295:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - name: Run Iteration 295 direct timelike TrU1 family reconstruction
        run: |
          python candidate_gravity/code/iteration295_timelike_tru1_family_reconstruction_s0016.py | tee iteration295_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: iteration295-result
          path: iteration295_result.json
