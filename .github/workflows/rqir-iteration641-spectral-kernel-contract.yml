name: RQIR Iter641 closed-loop spectral kernel contract
on:
  push:
    branches: [ main ]
    paths:
      - 'candidate_gravity/code/iteration641_closed_loop_spectral_kernel_contract.py'
      - '.github/workflows/rqir-iteration641-spectral-kernel-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spectral-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Iter641 spectral kernel contract
        run: python candidate_gravity/code/iteration641_closed_loop_spectral_kernel_contract.py
      - name: Fail-closed raw authority audit
        run: |
          python - <<'PY'
          import hashlib,json,math
          from pathlib import Path
          d=Path('results/iteration641_closed_loop_spectral_kernel_contract');r=d/'result.json';a=d/'authority_audit.json'
          o=json.loads(r.read_text());au=json.loads(a.read_text());sha=hashlib.sha256(r.read_bytes()).hexdigest();f=[]
          if o.get('classification')!='PASS_ITER641_PROSPECTIVE_CLOSED_LOOP_DENOMINATOR_SPECTRAL_KERNEL_CONTRACT__NUMERATOR_EXPLICITLY_BLOCKED__NON_RESIDUAL': f.append('classification drift')
          if o.get('failures')!=[] or not o.get('scientific_gate_pass'): f.append('scientific failure')
          if not math.isclose(float(o.get('frozen_threshold',float('nan'))),1.96,rel_tol=0,abs_tol=2e-15): f.append('threshold drift')
          if o.get('unsupported_numerator_policy')!='BLOCKED_NOT_ZERO_FILLED': f.append('unsupported policy drift')
          if o.get('zero_fill') is not False or o.get('candidate_values_used') is not False: f.append('guardrail drift')
          if o.get('source_born_subtraction')!='NOT_PERFORMED' or o.get('native_Y_Tcut_projection')!='NOT_PERFORMED': f.append('premature downstream step')
          if au.get('result_sha256')!=sha or au.get('classification')!='PASS_RAW_AUTHORITY_AUDIT_ITER641_SPECTRAL_KERNEL_CONTRACT': f.append('audit binding drift')
          if f: raise SystemExit('\n'.join(f))
          print('PASS Iter641 raw audit',sha)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rqir-iter641-spectral-kernel-contract
          path: results/iteration641_closed_loop_spectral_kernel_contract/
          retention-days: 30
