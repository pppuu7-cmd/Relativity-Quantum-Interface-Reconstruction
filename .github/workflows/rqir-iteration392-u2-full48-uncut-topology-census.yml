name: rqir-iteration392-u2-full48-uncut-topology-census

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration392_u2_full48_uncut_topology_census.py'
      - '.github/workflows/rqir-iteration392-u2-full48-uncut-topology-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration392:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run full-48 topology census
        run: |
          mkdir -p candidate_gravity/artifacts/iteration392
          python candidate_gravity/code/iteration392_u2_full48_uncut_topology_census.py > candidate_gravity/artifacts/iteration392/iteration392_result.json
      - name: Sentinel audit
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('candidate_gravity/artifacts/iteration392/iteration392_result.json')
          raw=p.read_bytes(); o=json.loads(raw)
          c=o.get('census',{})
          ok=bool(o.get('iteration')==392 and o.get('scientific_gate_pass') is True and
                  c.get('total_repeated_cut_channels')==48 and
                  c.get('structural_equivalence_no_uncut_iff_two_groups') is True and
                  len(o.get('channels',[]))==48)
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':392,
             'sha256':hashlib.sha256(raw).hexdigest(),'scientific_authority_pass':ok,
             'classification':o.get('classification')}
          pathlib.Path('candidate_gravity/artifacts/iteration392/iteration392_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration392-result
          path: candidate_gravity/artifacts/iteration392/
          if-no-files-found: error
          retention-days: 90
