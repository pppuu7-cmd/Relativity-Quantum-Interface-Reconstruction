name: rqir-iteration356-u2-family-origin-topology-classification

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration356_u2_family_origin_topology_classification.py'
      - '.github/workflows/rqir-iteration356-u2-family-origin-topology-classification.yml'

jobs:
  iteration356:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run U2 family origin topology classification
        run: python candidate_gravity/code/iteration356_u2_family_origin_topology_classification.py > iteration356_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration356_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==356 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':356,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==356,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration356_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration356-result
          path: |
            iteration356_result.json
            iteration356_authority_audit.json
