name: RQIR Iter587 source offshell routing audit
on:
  push:
    branches: [ main ]
    paths:
      - 'analysis/source_offshell_symmetric_routing_iteration587.py'
      - '.github/workflows/rqir-iteration587-source-offshell-routing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offshell-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run frozen off-shell routing and Ward audit
        run: python analysis/source_offshell_symmetric_routing_iteration587.py
      - name: Fail-closed authority audit
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('results/iteration587_source_offshell_symmetric_routing'); r=d/'result.json'; a=d/'authority_audit.json'
          o=json.loads(r.read_text()); au=json.loads(a.read_text()); sha=hashlib.sha256(r.read_bytes()).hexdigest(); f=[]
          if o.get('iteration')!=587: f.append('iteration drift')
          if o.get('classification')!='PASS_PROSPECTIVE_MSSC001_SYMMETRIC_OFFSHELL_K1_ROUTING_AND_WARD_CONTRACT__NON_RESIDUAL': f.append('classification drift/fail')
          if o.get('failures')!=[] or not o.get('scientific_gate_pass'): f.append('scientific failures')
          coeff=[x['ward_longitudinal_coefficient_exact'] for x in o.get('rows',[])]
          if coeff!=['6/25','81/200','91/200']: f.append('Ward coefficient drift')
          if o.get('source_born_subtraction')!='NOT_PERFORMED': f.append('premature subtraction')
          if o.get('ANSATZ_003')!='FORBIDDEN' or o.get('Fisher_resources')!='FORBIDDEN': f.append('guardrail drift')
          if au.get('result_sha256')!=sha or au.get('classification')!='PASS_RAW_AUTHORITY_AUDIT_ITER587_OFFSHELL_ROUTING': f.append('audit binding drift')
          if f: raise SystemExit('\n'.join(f))
          print('PASS Iter587 raw audit',sha)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rqir-iter587-source-offshell-routing
          path: results/iteration587_source_offshell_symmetric_routing/
          retention-days: 30
