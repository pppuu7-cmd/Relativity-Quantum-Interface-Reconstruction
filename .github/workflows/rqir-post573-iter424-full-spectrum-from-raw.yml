name: RQIR post573 Iter424 full spectrum from raw
on:
  push:
    paths:
      - 'candidate_gravity/triggers/post573_iter424_full_spectrum_from_raw.trigger'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  iter424_full_spectrum_from_raw:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check -q numpy==2.1.3 mpmath==1.3.0 scipy==1.14.1
      - name: Build raw-valid artifact manifests
        run: |
          root="candidate_gravity/artifacts/post573_iter424_full_spectrum_from_raw"; mkdir -p "$root/bundle/basehalf" "$root/bundle/quarter"
          python candidate_gravity/code/post523_independent_base_half_assembly.py --emit-artifact-manifest > "$root/basehalf_manifest.json"
          python candidate_gravity/code/post573_iter424_full_spectrum_gate.py --emit-quarter-manifest > "$root/quarter_manifest.json"
      - name: Download exact raw authority results by historical run and artifact name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess,tempfile,urllib.request
          root=pathlib.Path('candidate_gravity/artifacts/post573_iter424_full_spectrum_from_raw'); repo='pppuu7-cmd/Relativity-Quantum-Interface-Reconstruction'
          def metadata(aid):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/artifacts/{aid}',headers={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10','User-Agent':'rqir-actions'})
              with urllib.request.urlopen(req,timeout=60) as r: return json.load(r)
          def get_result(aid):
              m=metadata(aid); runid=int(m['workflow_run']['id']); name=str(m['name'])
              with tempfile.TemporaryDirectory() as td:
                  subprocess.run(['gh','run','download',str(runid),'-R',repo,'-n',name,'-D',td],check=True,env={**os.environ,'GH_TOKEN':os.environ['GH_TOKEN']})
                  names=[p for p in pathlib.Path(td).rglob('result.json')]
                  if len(names)!=1: raise SystemExit(('artifact_result_count_drift',aid,runid,name,[str(x) for x in names]))
                  return names[0].read_bytes(),runid,name
          bh=json.loads((root/'basehalf_manifest.json').read_text()); transport=[]
          for x in bh:
              d=root/'bundle'/'basehalf'/str(x['rank']); d.mkdir(parents=True,exist_ok=True); raw,runid,name=get_result(int(x['artifact_id'])); (d/'result.json').write_bytes(raw); transport.append({'artifact_id':x['artifact_id'],'run_id':runid,'name':name})
          q=json.loads((root/'quarter_manifest.json').read_text())
          for x in q:
              d=root/'bundle'/'quarter'/str(x['rank']); d.mkdir(parents=True,exist_ok=True); raw,runid,name=get_result(int(x['artifact_id'])); (d/'result.json').write_bytes(raw); transport.append({'artifact_id':x['artifact_id'],'run_id':runid,'name':name})
          (root/'transport_provenance.json').write_text(json.dumps(transport,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'basehalf_artifacts':len(bh),'quarter_artifacts':len(q),'transport_records':len(transport)},sort_keys=True))
          PY
      - name: Run frozen Iter407 spectral reconstruction and Iter424 numerical clauses
        run: |
          root="candidate_gravity/artifacts/post573_iter424_full_spectrum_from_raw"
          set +e
          python candidate_gravity/code/post573_iter424_full_spectrum_gate.py --basehalf-manifest "$root/basehalf_manifest.json" --bundle "$root/bundle" > "$root/result.json"
          rc=$?
          echo "$rc" > "$root/scientific_exit_code.txt"
          exit 0
      - name: Raw result integrity audit
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate_gravity/artifacts/post573_iter424_full_spectrum_from_raw'); p=root/'result.json'
          if not p.exists() or p.stat().st_size==0: raise SystemExit(2)
          raw=p.read_bytes(); o=json.loads(raw); t=o.get('target',{}); fr=o.get('frozen',{}); cs=o.get('iteration424_clause_status',{})
          allowed={'PASS_ITER424_FULL_SPECTRUM_NUMERICAL_CLAUSES__TENSOR11_STILL_BLOCKED__NON_PROMOTING','FAIL_ITER424_FULL_SPECTRUM_NUMERICAL_CLAUSE__NON_PROMOTING'}
          valid=bool(o.get('stage')=='POST573_ITER424_FULL_SPECTRUM_FROM_RAW_ARTIFACTS__UNNUMBERED_COLLISION_SAFE' and o.get('classification') in allowed and o.get('promotes_physical_coordinate') is False and t.get('double_double_index')==2 and t.get('class_id')==3 and abs(float(t.get('q_squared'))+1)<1e-12 and fr.get('mass_steps')==[5e-06,2.5e-06,1.25e-06] and fr.get('precision_digits')==[80,120] and cs.get('direct_original_integrand_crosscheck','').startswith('PASS_INHERITED_ITERATION573') and cs.get('tensor_degree_1_1_fit_residual','').startswith('OPERATIONAL_BLOCKED'))
          a={'schema':'rqir_action_result_authority_audit_v1','stage':o.get('stage'),'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'classification':o.get('classification'),'scientific_gate_pass':o.get('scientific_gate_pass'),'raw_result_integrity_valid':valid,'authority_scope':'ITER424_FULL_SPECTRUM_NUMERICAL_CLAUSES_FROM_RAW_VALID_ARTIFACTS__NON_PROMOTING'}
          (root/'authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not valid: raise SystemExit(2)
          PY
      - name: Upload raw artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqir-post573-iter424-full-spectrum-from-raw
          path: candidate_gravity/artifacts/post573_iter424_full_spectrum_from_raw/
          retention-days: 90
