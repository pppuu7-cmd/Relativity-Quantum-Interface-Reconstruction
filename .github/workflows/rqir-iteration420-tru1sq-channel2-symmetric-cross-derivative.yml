name: rqir-iteration420-tru1sq-channel2-symmetric-cross-derivative

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration420_tru1sq_channel2_symmetric_cross_derivative.py'
      - '.github/workflows/rqir-iteration420-tru1sq-channel2-symmetric-cross-derivative.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration420:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check -q numpy
      - name: Run symmetric-cross mixed derivative gate
        run: |
          root="candidate_gravity/artifacts/iteration420"
          mkdir -p "$root"
          python candidate_gravity/code/iteration420_tru1sq_channel2_symmetric_cross_derivative.py > "$root/iteration420_result.json"
      - name: Raw parse and authority audit
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,math
          root=pathlib.Path('candidate_gravity/artifacts/iteration420')
          p=root/'iteration420_result.json'
          if not p.exists() or p.stat().st_size==0: raise SystemExit(2)
          raw=p.read_bytes(); o=json.loads(raw); ch=o.get('channel',{}); th=o.get('thresholds',{}); rep=o.get('representation',{})
          ok=bool(
              o.get('iteration')==420 and o.get('scientific_gate_pass') is True and
              ch.get('double_double_global_index')==2 and ch.get('class_id')==3 and abs(float(ch.get('q_squared'))+1.0)<1e-12 and
              ch.get('status') in ('CONVERGED','BLOCKED_CONVERGENCE') and
              abs(float(rep.get('radius'))-1e-5)<1e-18 and
              th.get('physical_stability_scaled_max')==2e-05 and th.get('fit_residual_scaled_max')==2e-05 and
              th.get('design_condition_number_max')==1000.0 and th.get('direct_original_integrand_crosscheck_scaled_max')==2e-06
          )
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':420,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'classification':o.get('classification'),'status':ch.get('status'),'scientific_authority_pass':ok}
          (root/'iteration420_authority_audit.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(2)
          PY
      - name: Upload physical artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration420-channel2-symmetric-cross
          path: candidate_gravity/artifacts/iteration420/
          if-no-files-found: warn
          retention-days: 90
