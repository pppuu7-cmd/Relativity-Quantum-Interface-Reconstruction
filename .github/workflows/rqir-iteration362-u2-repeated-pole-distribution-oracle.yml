name: rqir-iteration362-u2-repeated-pole-distribution-oracle

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration362_u2_repeated_pole_distribution_oracle.py'
      - '.github/workflows/rqir-iteration362-u2-repeated-pole-distribution-oracle.yml'

jobs:
  iteration362:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy scipy
      - name: Run repeated-pole smooth-distribution oracle
        run: python candidate_gravity/code/iteration362_u2_repeated_pole_distribution_oracle.py > iteration362_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration362_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==362 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':362,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==362,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration362_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration362-result
          path: |
            iteration362_result.json
            iteration362_authority_audit.json
