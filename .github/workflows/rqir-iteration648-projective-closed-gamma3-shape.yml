name: RQIR Iter648 projective closed-Gamma3 shape gate

on:
  push:
    paths:
      - 'candidate_gravity/code/iteration648_projective_closed_gamma3_shape_gate.py'
      - '.github/workflows/rqir-iteration648-projective-closed-gamma3-shape.yml'
  workflow_dispatch:

jobs:
  iteration648:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate prospective projective closed-Gamma3 shape
        run: python candidate_gravity/code/iteration648_projective_closed_gamma3_shape_gate.py
      - name: Validate fail-closed Iter648 result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/iteration648_projective_closed_gamma3_shape_gate/result.json').read_text())
          assert d['iteration']==648
          assert d['MODEL_READINESS']=='24%'
          assert d['candidate_values_used'] is False
          assert d['zero_fill'] is False
          assert d['source_born_subtraction']=='NOT_PERFORMED'
          assert d['native_Y_Tcut_projection']=='NOT_PERFORMED'
          assert d['comparator_quotient']=='NOT_PERFORMED'
          assert d['prospective_definition']['reference_component_selected_from_values'] is False
          assert d['prospective_definition']['iter645_code_commit_pre_result']=='4e578063ab89fe56d3238b6bfceeaddc9461e55c'
          if d['scientific_gate_pass']:
              assert d['classification']=='PASS_ITER648_PROJECTIVE_CLOSED_GAMMA3_GLOBAL_FACTOR_CANCELLATION__NON_RESIDUAL'
              assert d['norm2'] > 1e-30
              assert d['failures']==[]
              assert d['validation']['trace_error'] <= 2e-12
              assert d['validation']['hermiticity_error'] <= 2e-12
              assert d['validation']['idempotence_error'] <= 2e-12
              assert d['validation']['scaling_invariance_error'] <= 2e-12
          else:
              assert d['classification'].startswith('BLOCKED_ITER648_')
          print(d['classification'])
          PY
      - name: Upload raw Iter648 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iteration648-projective-closed-gamma3-shape
          path: results/iteration648_projective_closed_gamma3_shape_gate/result.json
          if-no-files-found: error
