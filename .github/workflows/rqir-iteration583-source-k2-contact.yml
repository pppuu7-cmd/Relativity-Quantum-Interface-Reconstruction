name: RQIR Iter583 frozen MSSC source K2 contact

on:
  push:
    branches: [ main ]
    paths:
      - 'analysis/source_k2_contact_iteration583.py'
      - '.github/workflows/rqir-iteration583-source-k2-contact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-k2-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run frozen MSSC-001 source K2 expansion audit
        run: python analysis/source_k2_contact_iteration583.py
      - name: Fail-closed raw result audit
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('results/iteration583_source_k2')
          r=root/'result.json'
          a=root/'authority_audit.json'
          result=json.loads(r.read_text())
          audit=json.loads(a.read_text())
          sha=hashlib.sha256(r.read_bytes()).hexdigest()
          failures=[]
          if result.get('iteration') != 583: failures.append('iteration mismatch')
          if result.get('parent_source_authority') != 'MSSC-001 / Iteration218': failures.append('parent source mismatch')
          if result.get('source_born_subtraction') != 'NOT_PERFORMED': failures.append('premature Source/Born subtraction')
          if result.get('ANSATZ_003') != 'FORBIDDEN': failures.append('ANSATZ-003 guardrail violation')
          if result.get('Fisher_resources') != 'FORBIDDEN': failures.append('Fisher/resources guardrail violation')
          if result.get('failures') != []: failures.append('scientific regression failures present')
          if not result.get('raw_result_integrity_valid'): failures.append('raw_result_integrity_valid false')
          if audit.get('result_sha256') != sha: failures.append('result sha mismatch')
          if audit.get('classification') != 'PASS_RAW_AUTHORITY_AUDIT_ITER583_SOURCE_K2': failures.append('authority audit not PASS')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('PASS fail-closed Iter583 raw audit', sha)
          PY
      - name: Upload raw artifact
        uses: actions/upload-artifact@v4
        with:
          name: rqir-iter583-frozen-mssc-source-k2
          path: results/iteration583_source_k2/
          if-no-files-found: error
          retention-days: 30
