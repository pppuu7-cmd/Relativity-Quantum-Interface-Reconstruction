name: rqir-iteration347-u2-matched-timelike-rebase-contract

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration347_u2_matched_timelike_rebase_contract.py'
      - '.github/workflows/rqir-iteration347-u2-matched-timelike-rebase-contract.yml'

jobs:
  iteration347:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run matched timelike U2 rebase contract gate
        run: python candidate_gravity/code/iteration347_u2_matched_timelike_rebase_contract.py > iteration347_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration347_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==347 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':347,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==347,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration347_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration347-result
          path: |
            iteration347_result.json
            iteration347_authority_audit.json
