name: rqir-iteration359-u2-repeated-pole-derivative-contract

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate_gravity/code/iteration359_u2_repeated_pole_derivative_contract.py'
      - '.github/workflows/rqir-iteration359-u2-repeated-pole-derivative-contract.yml'

jobs:
  iteration359:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependency
        run: pip install numpy
      - name: Run repeated-pole multiplicity and derivative contract gate
        run: python candidate_gravity/code/iteration359_u2_repeated_pole_derivative_contract.py > iteration359_result.json
      - name: Sentinel/schema audit
        run: |
          python - <<'PY'
          import json,hashlib
          raw=open('iteration359_result.json','rb').read(); o=json.loads(raw)
          ok=isinstance(o,dict) and o.get('iteration')==359 and o.get('scientific_gate_pass') is True
          a={'schema':'rqir_action_result_authority_audit_v1','expected_iteration':359,
             'found_iterations':[o.get('iteration')],'top_level_object_count':1,
             'valid_single_top_level':True,'valid_expected_iteration':o.get('iteration')==359,
             'scientific_authority_pass':bool(ok),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          open('iteration359_authority_audit.json','w').write(json.dumps(a,indent=2,sort_keys=True)+'\n')
          assert ok
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iteration359-result
          path: |
            iteration359_result.json
            iteration359_authority_audit.json
